<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Profil — Nooxel World</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#061330">
  <link rel="icon" href="assets/favicon.png?v=2">
  <link rel="stylesheet" href="shop.css">
  <link rel="stylesheet" href="blue.css">
  <link rel="stylesheet" href="light.css">
  <link rel="stylesheet" href="tabbar.css">
  <style>.plainbar { position: relative; } #more-btn { margin-left: auto; } #more-menu { position: absolute; right: 1rem; top: 3.2rem; z-index: 20; background: #0d2150; border: 1px solid rgba(120,160,255,.25); border-radius: 14px; padding: .3rem; box-shadow: 0 8px 30px rgba(0,0,0,.5); } #more-menu button { display: block; width: 100%; text-align: left; border: 0; background: none; color: #e8efff; font: inherit; padding: .7rem 1rem; cursor: pointer; border-radius: 10px; } .privnote { margin: 1.2rem 1.1rem; padding: 1.2rem; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(120,160,255,.16); text-align: center; color: #b8c7e8; } .privnote svg { width: 34px; height: 34px; color: #7f95c9; }</style>
</head>
<body>
<div class="shell"><main>
  <div class="plainbar"><a data-back id="back" href="/" aria-label="Retour"></a><button id="more-btn" class="round" type="button" aria-label="Plus d'options" aria-haspopup="menu" style="border:0;background:none;color:inherit;width:44px;height:44px;cursor:pointer"></button></div>
  <div id="app"><p class="empty">Chargement…</p></div>
  <footer><a href="confidentialite.html">Confidentialité</a> · <a href="cgu.html">Conditions</a></footer>
</main></div>
<script src="tabbar.js" data-active="account"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="categories.js"></script>
<script src="shop.js"></script>
<script>
  const pseudo = new URLSearchParams(location.search).get("p") || "";
  const stars = (n) => el("span", { class: "stars", role: "img", "aria-label": `${n} sur 5`, text: "★".repeat(n) + "☆".repeat(5 - n) });
  let sum = null, rBefore = null, fBefore = null, fLoaded = false;

  async function boot() {
    const app = $("app");
    if (!sb || !(await currentSession())) { app.replaceChildren(el("div", { class: "card" }, el("h2", { text: "Connexion requise" }), el("p", { text: "Connectez-vous à votre compte Nooxel pour voir ce profil." }), el("a", { href: "/", text: "Aller à la connexion" }))); return; }
    if (await gateProfile()) return;
    const { data, error } = await sb.rpc("get_user_page", { p_pseudo: pseudo });
    if (error || !data) { app.replaceChildren(el("div", { class: "card" }, el("h2", { text: "Profil introuvable" }), el("p", { text: fr(error) }))); return; }
    if (data.is_self) { location.replace("compte.html"); return; }
    sum = data; document.title = sum.pseudo + " — Nooxel World"; render();
  }

  function render() {
    const app = $("app");
    $("back").append(icon("back", 26)); $("more-btn").append(icon("more", 24));
    const menu = el("div", { id: "more-menu", class: "hidden", role: "menu" }, el("button", { type: "button", id: "report-btn", role: "menuitem", text: "⚑ Signaler ce profil", onclick: () => { menu.classList.add("hidden"); openReportDialog({ kind: "user", pseudo: sum.pseudo, title: "Signaler ce profil" }); } }));
    $("more-btn").addEventListener("click", (e) => { e.stopPropagation(); menu.classList.toggle("hidden"); });
    document.addEventListener("click", () => menu.classList.add("hidden"));
    document.querySelector(".plainbar").append(menu);
    const av = sum.avatar_path ? el("img", { class: "avatar-photo", id: "pf-photo", src: avatarUrl(sum.avatar_path), alt: "", width: 100, height: 100 }) : (() => { const s = silhouette(100); s.classList.add("avatar"); return s; })();
    if (sum.is_private) {
      app.replaceChildren(el("div", { class: "profile", id: "profile" }, av, el("h2", { id: "pf-name", text: sum.pseudo })),
        el("div", { class: "privnote", id: "private-note" }, icon("lock", 34), el("p", { style: "margin:.6rem 0 0", text: "Ce profil est privé." }), el("small", { text: "Cette personne ne partage pas ses avis ni ses favoris." })));
      return;
    }
    const star = new DOMParser().parseFromString('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg>', "image/svg+xml").documentElement;
    const head = el("div", { class: "profile", id: "profile" }, av, el("h2", { id: "pf-name", text: sum.pseudo }),
      sum.active_contributor ? el("span", { class: "pill", id: "pf-badge" }, document.importNode(star, true), "Contributeur actif") : null,
      el("div", { class: "metrics" },
        el("div", {}, el("b", { id: "pf-reviews", text: String(sum.reviews_count) }), el("span", { text: sum.reviews_count > 1 ? "avis laissés" : "avis laissé" })),
        el("div", {}, el("b", { id: "pf-following", text: String(sum.following_count) }), el("span", { text: sum.following_count > 1 ? "commerces suivis" : "commerce suivi" }))));
    const secs = el("div", { class: "utabs", role: "group", "aria-label": "Sections du profil" },
      ...[["reviews", "Avis"], ["fav", "Favoris"]].map(([k, label]) => el("button", { type: "button", id: "sec-" + k, "aria-pressed": String(k === "reviews"), text: label, onclick: () => show(k) })));
    const rsec = el("div", { id: "section-reviews", class: "section" }, el("div", { id: "my-reviews" }), el("p", { class: "empty hidden", id: "no-reviews", text: "Aucun avis pour le moment." }),
      el("button", { class: "btn-outline hidden", id: "more-reviews", type: "button", text: "Voir plus", onclick: () => loadReviews() }));
    const fsec = el("div", { id: "section-fav", class: "section hidden" }, el("div", { class: "favgrid", id: "my-fav" }), el("p", { class: "empty hidden", id: "no-fav", text: "Aucun commerce suivi pour le moment." }),
      el("button", { class: "btn-outline hidden", id: "more-fav", type: "button", text: "Voir plus", onclick: () => loadFav() }));
    app.replaceChildren(head, secs, rsec, fsec); loadReviews(true);
  }
  function show(k) {
    for (const x of ["reviews", "fav"]) { $("sec-" + x).setAttribute("aria-pressed", String(x === k)); $("section-" + x).classList.toggle("hidden", x !== k); }
    if (k === "fav" && !fLoaded) { fLoaded = true; loadFav(true); }
  }

  async function loadReviews(first) {
    const more = $("more-reviews"); more.disabled = true;
    const { data, error } = await sb.rpc("user_reviews", { p_pseudo: sum.pseudo, p_before: rBefore, p_limit: 10 });
    more.disabled = false;
    if (error) { $("no-reviews").textContent = fr(error); $("no-reviews").classList.remove("hidden"); return; }
    for (const r of data) $("my-reviews").append(el("a", { class: "rrow", href: "commerce.html?id=" + encodeURIComponent(r.merchant_id), "data-review": r.id },
      el("span", { class: "thumb" }, r.logo_path ? el("img", { src: imgUrl(r.logo_path), alt: "", loading: "lazy" }) : null),
      el("div", { class: "main" }, el("div", { class: "l1" }, el("b", { text: r.business_name }), el("span", { text: dateFr(r.created_at) })),
        el("div", { class: "l2" }, catLabel(r.category), catLabel(r.category) && r.rating_avg != null ? " · " : "", r.rating_avg != null ? [el("b", { text: rateStr(r.rating_avg) }), " ", el("span", { class: "gold", text: "★" })] : null),
        el("p", { class: "txt", text: r.body })),
      el("span", { class: "chev", "aria-hidden": "true", text: "›" })));
    if (data.length) rBefore = data[data.length - 1].created_at;
    more.classList.toggle("hidden", data.length < 10);
    if (first) $("no-reviews").classList.toggle("hidden", data.length > 0);
  }

  async function loadFav(first) {
    const more = $("more-fav"); more.disabled = true;
    const { data, error } = await sb.rpc("user_following", { p_pseudo: sum.pseudo, p_before: fBefore, p_limit: 12 });
    more.disabled = false;
    if (error) { $("no-fav").textContent = fr(error); $("no-fav").classList.remove("hidden"); return; }
    for (const m of data) $("my-fav").append(el("a", { class: "fav", href: "commerce.html?id=" + encodeURIComponent(m.merchant_id), "data-fav": m.merchant_id },
      el("div", { class: "ph" }, m.cover_path || m.logo_path ? el("img", { src: imgUrl(m.cover_path || m.logo_path), alt: "", loading: "lazy" }) : null),
      el("div", { class: "fb" }, el("b", { text: m.business_name }), el("small", { text: catLabel(m.category) || " " }),
        m.review_count ? el("div", { class: "rt" }, rateStr(m.rating_avg), " ", el("span", { class: "gold", text: "★" })) : null)));
    if (data.length) fBefore = data[data.length - 1].followed_at;
    more.classList.toggle("hidden", data.length < 12);
    if (first) $("no-fav").classList.toggle("hidden", data.length > 0);
  }
  boot();
</script>
<script src="back.js"></script>
</body>
</html>
