<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Configurez votre profil — Nooxel World</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#061330">
  <link rel="icon" href="assets/favicon.png?v=2">
  <link rel="stylesheet" href="shop.css">
  <link rel="stylesheet" href="blue.css">
  <style>
    main { max-width: 420px; padding: calc(env(safe-area-inset-top, 0px) + 2.2rem) 1.4rem calc(env(safe-area-inset-bottom, 0px) + 2rem); text-align: center; }
    #logo { display: block; width: 150px; height: auto; margin: 0 auto; }
    h1 { margin: 1.1rem 0 .2rem; font-size: 1.9rem; line-height: 1.2; }
    .sub { margin: 0; color: var(--mute); font-size: 1.02rem; }
    .pick { position: relative; display: block; width: 176px; height: 176px; margin: 2.2rem auto 0; padding: 0; border: 0; border-radius: 50%; background: #e8eaee; cursor: pointer; }
    .pick .cam { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9aa0a8; }
    .pick .cam svg { width: 56px; height: 56px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .pick .pen { position: absolute; right: 2px; bottom: 6px; width: 54px; height: 54px; border-radius: 50%; background: #1a6bff; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px #081a40; }
    .pick .pen svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #file { display: none; }
    #pseudo { display: block; width: 100%; margin-top: 2.2rem; padding: 1.05rem 1.2rem; border: 1px solid #c4cbe0; border-radius: 16px; background: #fff; color: #1f1f1f; font: inherit; font-size: 1.05rem; }
    #pseudo::placeholder { color: #8d98b5; }
    #err { min-height: 1.4em; margin: .7rem 0 0; color: #ff8a72; font-size: .95rem; }
    #go { display: block; width: 100%; margin-top: .8rem; padding: 1.05rem; border: 0; border-radius: 16px; background: #0a72ff; color: #fff; font: inherit; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
    #go:disabled { opacity: .6; cursor: default; }
  </style>
</head>
<body>
<main>
  <img id="logo" src="assets/logo-nw.png" alt="Nooxel World" width="512" height="286">
  <h1>Configurez votre profil</h1>
  <p class="sub">pour continuer vers Nooxel World</p>
  <button type="button" class="pick" id="pick" aria-label="Choisir une photo de profil">
    <span class="cam" id="cam"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg></span>
    <span class="pen" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
  </button>
  <input type="file" id="file" accept="image/*">
  <input type="text" id="pseudo" maxlength="20" placeholder="Choisissez un pseudo" autocomplete="nickname" autocapitalize="off" spellcheck="false" aria-label="Pseudo">
  <p id="err" role="alert"></p>
  <button type="button" id="go">Continuer</button>
</main>
<script src="assets/vendor/supabase.js"></script>
<script src="shop.js"></script>
<script>
  const PERR = {
    invalid_pseudo: "Pseudo invalide : 3 à 20 caractères, lettres sans accent, chiffres, point, tiret ou souligné.",
    reserved_pseudo: "Ce pseudo n'est pas autorisé. Choisissez-en un autre.",
    bad_pseudo: "Ce pseudo n'est pas autorisé. Choisissez-en un autre.",
    pseudo_taken: "Ce pseudo est déjà pris.",
  };
  const perr = (e) => { const m = String(e && e.message || e || ""); const k = Object.keys(PERR).find((c) => m.includes(c)); return k ? PERR[k] : "Enregistrement impossible pour le moment. Réessayez dans un instant."; };
  // Redirection prudente : uniquement vers une page de l'application.
  const nextUrl = () => { const n = new URLSearchParams(location.search).get("next") || ""; return /^[a-z0-9-]+\.html(\?[\w=&%.\-]*)?$/i.test(n) && !n.startsWith("configurer-profil") ? n : "/"; };
  let blob = null;

  $("pick").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", async () => {
    $("err").textContent = ""; const f = $("file").files[0]; if (!f) return;
    try {
      blob = await cropJpeg(f, 400, 400);
      const old = $("pick").querySelector("img"); if (old) { URL.revokeObjectURL(old.src); old.remove(); }
      $("pick").prepend(el("img", { src: URL.createObjectURL(blob), alt: "Votre photo de profil" })); $("cam").classList.add("hidden");
    } catch (e) { blob = null; $("err").textContent = e instanceof Error ? e.message : "Photo illisible."; }
    $("file").value = "";
  });
  $("go").addEventListener("click", async () => {
    $("err").textContent = ""; const pseudo = $("pseudo").value.trim();
    if (!pseudo) { $("err").textContent = "Choisissez un pseudo pour continuer."; $("pseudo").focus(); return; }
    $("go").disabled = true;
    const p = await sb.rpc("set_pseudo", { p_pseudo: pseudo });
    if (p.error && !/pseudo_change_too_soon/.test(p.error.message)) { $("err").textContent = perr(p.error); $("go").disabled = false; return; }
    if (blob) {
      let path = null;
      try {
        const { data: { session } } = await sb.auth.getSession(); path = `${session.user.id}/avatar-${crypto.randomUUID()}.jpg`;
        const up = await sb.storage.from("avatars").upload(path, blob, { contentType: "image/jpeg", upsert: false }); if (up.error) throw up.error;
        const r = await sb.rpc("set_avatar", { p_path: path }); if (r.error) throw r.error;
        if (r.data) await sb.storage.from("avatars").remove([r.data]);
      } catch (e) { if (path) await sb.storage.from("avatars").remove([path]).catch(() => {}); /* la photo est facultative : on continue, elle pourra être ajoutée plus tard */ }
    }
    location.replace(nextUrl());
  });
  (async function boot() {
    if (!sb || !(await currentSession())) { location.replace("/"); return; }
    const { data } = await sb.rpc("my_profile_summary");
    if (data && data.pseudo) location.replace(nextUrl());
  })();
</script>
</body>
</html>
