<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notifications — Nooxel World</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#061330">
  <link rel="icon" href="assets/favicon.png?v=2">
  <link rel="stylesheet" href="tabbar.css">
  <style>
    :root { color-scheme: dark; --navy: #e8efff; --mute: #8ea3d0; --blue: #4a8bff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(120% 80% at 50% 0%, #0c2152, #061330 60%) no-repeat #061330; background-attachment: fixed; color: var(--navy); font: 16px/1.4 system-ui, -apple-system, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 0 1rem 8rem; }
    header { display: flex; align-items: center; gap: .8rem; padding: calc(env(safe-area-inset-top, 0px) + .8rem) 0 .6rem; }
    #back { color: var(--navy); width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; margin-left: -.5rem; }
    #back svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { margin: 0; font-size: 1.7rem; flex: 1; }
    #read-all { border: 0; background: none; color: #7fb0ff; font: inherit; font-size: .82rem; white-space: nowrap; cursor: pointer; padding: .4rem 0; }
    #read-all:disabled { color: #4b5f8f; cursor: default; }
    h2 { margin: 1.4rem .2rem .6rem; font-size: 1.1rem; font-weight: 500; color: var(--mute); }
    .n { display: flex; gap: .9rem; align-items: flex-start; padding: .85rem; border-radius: 16px; margin: 0 0 .7rem; background: #0d2150; border: 1px solid rgba(120,160,255,.12); position: relative; }
    .n.unread { background: #17398a; border-color: rgba(120,170,255,.35); }
    .av { position: relative; width: 56px; height: 56px; flex: none; }
    .av .face { width: 56px; height: 56px; border-radius: 50%; background: #e3e6ea; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
    .av .face svg { width: 82%; height: 82%; fill: #9aa0a8; }
    .av .face.shop { align-items: center; background: #1a3270; color: #e8efff; font-weight: 700; font-size: 1.5rem; }
    .av .face.app { align-items: center; }
    .av .face.app svg { width: 52%; height: 52%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .face.app.green { background: rgba(40,180,100,.2); color: #4fd58a; } .face.app.blue { background: rgba(74,139,255,.22); color: #7fb0ff; }
    .badge { position: absolute; right: -3px; bottom: -3px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #0d2150; display: flex; align-items: center; justify-content: center; color: #fff; }
    .badge svg { width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .badge.plus, .badge.reply { background: #2a6fe8; } .badge.star { background: #f5a623; } .badge.star svg { fill: #fff; stroke: none; }
    .body { flex: 1; min-width: 0; padding-top: .25rem; font-size: .93rem; overflow-wrap: anywhere; }
    .body b { font-weight: 700; }
    .meta { display: flex; flex-direction: column; align-items: flex-end; gap: .6rem; flex: none; color: var(--mute); font-size: .78rem; white-space: nowrap; padding-top: .2rem; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }
    .empty { text-align: center; color: var(--mute); padding: 3rem 1rem; }
    .more { display: block; margin: .5rem auto 1rem; padding: .6rem 1.4rem; border: 1px solid rgba(120,160,255,.3); border-radius: 999px; background: transparent; color: #a9c8ff; font: inherit; cursor: pointer; }
    a.n { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="shell"><main>
  <header>
    <a id="back" href="/" aria-label="Retour à la carte"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1>Notifications</h1>
    <button type="button" id="read-all">Tout marquer comme lu</button>
  </header>
  <div id="app"></div>
</main></div>
<script src="assets/vendor/supabase.js"></script>
<script src="shop.js"></script>
<script src="tabbar.js" data-active="notifications"></script>
<script>
  const C = (cls, ...kids) => el("span", { class: cls }, ...kids);
  const svgEl = (inner) => { const t = document.createElement("template"); t.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`; return t.content.firstChild; };
  const PERSON = '<circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/>', SHIELD = '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/>';
  const BADGES = { follow: ["plus", '<path d="M12 5v14M5 12h14"/>'], review: ["star", '<path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.3L12 17l-5.6 3.2 1.3-6.3L3 9.6l6.3-.7z"/>'], reply: ["reply", '<path d="M5 6h14v9H10l-4 3v-3H5z"/>'] };
  function avatar(n) {
    const box = C("av");
    if (n.kind === "report_done") box.append(C("face app green", svgEl(SHIELD)));
    else if (n.kind === "verified") box.append(C("face app blue", svgEl(SHIELD)));
    else if (n.kind === "post" || n.kind === "reply") box.append(C("face shop", (n.name || "?").charAt(0).toUpperCase()));
    else box.append(C("face", svgEl(PERSON)));
    const b = BADGES[n.kind]; if (b) box.append(C("badge " + b[0], svgEl(b[1])));
    return box;
  }
  function textOf(n) {
    const name = el("b", { text: n.name || "" });
    switch (n.kind) {
      case "follow": return [name, " s'est abonné(e) à votre page"];
      case "review": return [name, ` a laissé un avis ${n.rating} étoile${n.rating > 1 ? "s" : ""} sur votre page : “${n.snippet || ""}”`];
      case "reply": return [name, " a répondu à votre avis"];
      case "post": return [name, " a fait une nouvelle publication"];
      case "report_done": return [el("b", { text: "Votre signalement a été traité" })];
      case "verified": return [el("b", { text: "Votre profil professionnel" }), el("br"), "a été vérifié"];
    }
    return [""];
  }
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  const fmtDate = (d) => { const s = d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }); return s.charAt(0).toUpperCase() + s.slice(1); };
  const groupOf = (d) => { const days = (Date.now() - d.getTime()) / 864e5; return sameDay(d, new Date()) ? 0 : days < 7 ? 1 : 2; };
  const TITLES = ["Aujourd'hui", "Cette semaine", "Plus ancien"];
  let items = [], before = null;
  const dest = (n) => ({ post: "commerce.html?id=" + n.merchant_id, reply: "commerce.html?id=" + n.merchant_id, review: "compte.html", follow: "compte.html", verified: "compte.html" })[n.kind] || null;

  function render() {
    const app = $("app"); app.replaceChildren();
    if (!items.length) { app.append(el("p", { class: "empty", id: "empty", text: "Aucune notification pour le moment. Vous serez prévenu ici des abonnements, des avis, des réponses et des publications des commerces que vous suivez." })); }
    for (let g = 0; g < 3; g++) {
      const part = items.filter((n) => groupOf(new Date(n.created_at)) === g); if (!part.length) continue;
      app.append(el("h2", { text: TITLES[g] }));
      for (const n of part) {
        const d = new Date(n.created_at), u = !n.read, to = dest(n);
        const row = el(to ? "a" : "article", { class: "n" + (u ? " unread" : ""), "data-id": n.id, "data-state": u ? "unread" : "read", href: to || false },
          avatar(n), el("div", { class: "body" }, ...textOf(n)),
          el("div", { class: "meta" }, el("span", { class: "when", text: g === 0 ? d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : fmtDate(d) }), u ? el("span", { class: "dot" }) : null));
        if (u) row.addEventListener("click", () => { sb.rpc("mark_notifications_read", { p_ids: [n.id] }).then(() => window.dispatchEvent(new Event("notifs-changed"))); });
        app.append(row);
      }
    }
    if (items.length >= 30) app.append(el("button", { class: "more", id: "more", type: "button", text: "Voir plus", onclick: () => load() }));
    $("read-all").disabled = !items.some((n) => !n.read);
  }
  async function load(first) {
    const { data, error } = await sb.rpc("my_notifications", { p_before: before, p_limit: 30 });
    if (error) { $("app").replaceChildren(el("p", { class: "empty", id: "err", text: fr(error) })); return; }
    items = first ? data : items.concat(data); if (data.length) before = data[data.length - 1].created_at; render();
    if (window.setNotifBadge) window.dispatchEvent(new Event("notifs-changed"));
  }
  $("read-all").addEventListener("click", async () => {
    $("read-all").disabled = true;
    const { error } = await sb.rpc("mark_notifications_read", {});
    if (error) { $("read-all").disabled = false; return; }
    items.forEach((n) => { n.read = true; }); render(); window.setNotifBadge(0);
  });
  (async function boot() {
    if (!sb || !(await currentSession())) { $("read-all").classList.add("hidden"); $("app").replaceChildren(el("p", { class: "empty" }, "Connectez-vous pour voir vos notifications. ", el("a", { href: "/", text: "Se connecter" }))); return; }
    if (await gateProfile()) return;
    load(true);
  })();
</script>
</body>
</html>
