  // ---- page publique : adresse (boutique) ou zone d'intervention (indépendant)
  function photonPick(input, list, err, onPick) {          // recherche de lieu (Photon / OpenStreetMap) avec suggestions
    let timer = null, ctl = null;
    input.addEventListener("input", () => {
      clearTimeout(timer); const q = input.value.trim(); list.replaceChildren();
      if (q.length < 3) return;
      timer = setTimeout(async () => {
        if (ctl) ctl.abort(); ctl = new AbortController();
        try {
          const r = await fetch("https://photon.komoot.io/api/?limit=5&lang=fr&q=" + encodeURIComponent(q), { signal: ctl.signal });
          const feats = ((await r.json()).features || []).filter((f) => f.geometry && f.geometry.coordinates);
          list.replaceChildren(...feats.map((f) => { const p = f.properties; const li = onPick(p, f.geometry.coordinates); return li; }).filter(Boolean));
        } catch (e) { if (e.name !== "AbortError") err.textContent = "Recherche indisponible pour le moment."; }
      }, 350);
    });
  }

  // ---- identité de la page : catégorie, logo, couverture, site, téléphone, horaires (tout est vide au départ)
  async function cropJpeg(file, w, h) {                  // recadre au centre, redimensionne, JPEG : retire aussi les métadonnées (GPS…)
    if (!file || !file.type.startsWith("image/")) throw new Error("Choisissez une photo (image).");
    if (file.size > 30e6) throw new Error("Cette image est trop lourde.");
    let src;
    try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch { src = await new Promise((ok, no) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("Impossible de lire cette image.")); i.src = u; }); }
    const sw = src.width || src.naturalWidth, sh = src.height || src.naturalHeight, k = Math.max(w / sw, h / sh);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(src, (w - sw * k) / 2, (h - sh * k) / 2, sw * k, sh * k);
    for (const q of [0.85, 0.72, 0.58]) { const b = await new Promise((r) => c.toBlob(r, "image/jpeg", q)); if (b && b.size <= 1.5e6) return b; }
    throw new Error("Image trop lourde même réduite.");
  }
  const DAYS = [["mon", "Lundi"], ["tue", "Mardi"], ["wed", "Mercredi"], ["thu", "Jeudi"], ["fri", "Vendredi"], ["sat", "Samedi"], ["sun", "Dimanche"]];
  const ZONES = [["Europe/Paris", "France métropolitaine"], ["America/Martinique", "Martinique, Guadeloupe"], ["America/Cayenne", "Guyane"], ["Indian/Reunion", "La Réunion"], ["Indian/Mayotte", "Mayotte"], ["Pacific/Noumea", "Nouvelle-Calédonie"], ["Pacific/Tahiti", "Polynésie française"], ["Pacific/Wallis_and_Futuna", "Wallis-et-Futuna"], ["America/Miquelon", "Saint-Pierre-et-Miquelon"]];

  function identityEditor(d) {
    const err = el("p", { class: "err", id: "id-err" }), ok = el("p", { class: "okmsg", id: "id-ok" });
    const cur = { logo: d.logo_path || null, cover: d.cover_path || null };
    const imgField = (kind, label, w, h, round) => {
      const CAM = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1.1-1.6c.3-.4.7-.6 1.2-.6h4c.5 0 .9.2 1.2.6L16.3 6h1.2A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.4"/></svg>';
      const prev = el("img", { id: kind + "-preview", alt: "" }); if (cur[kind]) prev.src = mediaUrl(cur[kind]);
      const ph = el("span", { class: "upl-ph" }); ph.innerHTML = CAM;
      const box = el("div", { class: "upl-prev " + (round ? "round" : "wide") + (cur[kind] ? " has" : "") }, ph, prev);
      const file = el("input", { type: "file", id: kind + "-file", accept: "image/*", class: "upl-file" });
      const pickTxt = el("span", { id: kind + "-pick-label", text: cur[kind] ? "Remplacer la photo" : "Choisir une photo" });
      const ic = document.createElement("span"); ic.className = "upl-ic"; ic.innerHTML = CAM;
      const pick = el("label", { class: "upl-btn", id: kind + "-pick" }, ic, pickTxt, file);
      const rm = el("button", { class: "upl-rm" + (cur[kind] ? "" : " hidden"), id: kind + "-remove", type: "button", text: "Retirer" });
      const save = async (path) => {
        const col = kind === "logo" ? "logo_path" : "cover_path", old = cur[kind];
        const { error } = await sb.from("merchant_profiles").update({ [col]: path }).eq("id", state.merchant_id);
        if (error) throw error;
        cur[kind] = path; if (old && old !== path) await sb.storage.from("merchant-media").remove([old]);
        if (path) prev.src = mediaUrl(path); box.classList.toggle("has", !!path); pickTxt.textContent = path ? "Remplacer la photo" : "Choisir une photo";
        rm.classList.toggle("hidden", !path);
      };
      file.addEventListener("change", async () => {
        err.textContent = ""; ok.textContent = ""; if (!file.files[0]) return; file.disabled = true; pick.classList.add("busy"); pickTxt.textContent = "Envoi en cours…";
        let path = null;
        try {
          const blob = await cropJpeg(file.files[0], w, h); path = `${state.merchant_id}/${kind}-${crypto.randomUUID()}.jpg`;
          const up = await sb.storage.from("merchant-media").upload(path, blob, { contentType: "image/jpeg", upsert: false }); if (up.error) throw up.error;
          await save(path); ok.textContent = kind === "logo" ? "Logo enregistré." : "Photo de couverture enregistrée.";
        } catch (e) { if (path) await sb.storage.from("merchant-media").remove([path]); pickTxt.textContent = cur[kind] ? "Remplacer la photo" : "Choisir une photo"; err.textContent = e instanceof Error && !e.message.includes("_") ? e.message : "Envoi impossible. Réessayez."; }
        file.value = ""; file.disabled = false; pick.classList.remove("busy");
      });
      rm.addEventListener("click", async () => { err.textContent = ""; try { await save(null); ok.textContent = "Retiré."; } catch (e) { err.textContent = "Enregistrement impossible."; } });
      return el("div", { id: kind + "-field", class: "upl" }, box, el("div", { class: "upl-main" }, el("b", { text: label }), el("small", { text: round ? "Ce que vos clients voient à côté de votre nom. JPG ou PNG, carré de préférence." : "Le grand bandeau en haut de votre page. JPG ou PNG, format large." }), el("div", { class: "upl-actions" }, pick, rm), aiNote()));
    };
    // Choix du métier : grille d'icônes (une par métier, la même que sur les épingles de la carte)
    const cat = { value: d.category || "" };
    const catBtn = el("button", { type: "button", class: "catpick", id: "id-category" });
    const paintCat = () => { catBtn.replaceChildren(); if (cat.value) { const t = document.createElement("template"); t.innerHTML = catSvg(cat.value, 22); catBtn.append(t.content.firstChild, el("span", { text: catLabel(cat.value) })); } else catBtn.append(el("span", { text: "— Choisir —" })); };
    paintCat();
    catBtn.addEventListener("click", () => {
      const dlg = el("dialog", { class: "catdlg", id: "cat-dialog" }); const grid = el("div", { class: "catgrid" });
      for (const [v, l] of CAT_LIST) { const t = document.createElement("template"); t.innerHTML = catSvg(v, 30); grid.append(el("button", { type: "button", class: "cattile" + (v === cat.value ? " on" : ""), "data-cat": v, onclick: () => { cat.value = v; paintCat(); dlg.close(); } }, t.content.firstChild, el("span", { text: l }))); }
      dlg.append(el("h3", { text: "Votre métier" }), grid, el("button", { class: "btn ghost small", type: "button", text: cat.value ? "Retirer la catégorie" : "Fermer", onclick: () => { if (cat.value) { cat.value = ""; paintCat(); } dlg.close(); } }));
      dlg.addEventListener("close", () => dlg.remove()); document.body.append(dlg); dlg.showModal();
    });
    const site = el("input", { type: "url", id: "id-website", maxlength: 200, placeholder: "https://…", autocomplete: "off" }); site.value = d.website || "";
    const phone = el("input", { type: "tel", id: "id-phone", maxlength: 20, placeholder: "Ex. 04 12 34 56 78", autocomplete: "off" }); phone.value = d.contact_phone || "";
    const tz = el("select", { id: "id-timezone" }, ...ZONES.map(([v, l]) => el("option", { value: v, text: l }))); tz.value = d.timezone || "Europe/Paris";
    const oh = d.opening_hours || {};
    const rows = DAYS.map(([k, label]) => {
      const sl = oh[k] || [];
      const on = el("input", { type: "checkbox", id: "h-" + k + "-on", "aria-label": label + " : ouvert" }); on.checked = sl.length > 0;
      const t = (id, v) => { const i = el("input", { type: "time", id, step: 300 }); i.value = v || ""; return i; };
      const f = [t("h-" + k + "-a1", sl[0] && sl[0][0]), t("h-" + k + "-b1", sl[0] && sl[0][1]), t("h-" + k + "-a2", sl[1] && sl[1][0]), t("h-" + k + "-b2", sl[1] && sl[1][1])];
      const sync = () => f.forEach((i) => { i.disabled = !on.checked; }); on.addEventListener("change", () => { if (on.checked && !f[0].value) { f[0].value = "09:00"; f[1].value = "18:00"; } sync(); }); sync();
      return { k, label, on, f, row: el("div", { class: "hrow" }, el("label", { class: "check", style: "margin:0;min-width:7.5rem" }, on, el("span", { text: label })), el("div", { class: "hslots" }, f[0], "–", f[1], el("span", { class: "hint", text: "et" }), f[2], "–", f[3])) };
    });
    const hours = () => {
      const o = {}, any = rows.some((r) => r.on.checked); if (!any) return null;
      for (const r of rows) {
        o[r.k] = [];
        if (!r.on.checked) continue;
        for (const [a, b] of [[r.f[0], r.f[1]], [r.f[2], r.f[3]]]) {
          if (!a.value && !b.value) continue;
          if (!a.value || !b.value || a.value >= b.value) throw new Error(`${r.label} : l'heure d'ouverture doit être avant la fermeture.`);
          o[r.k].push([a.value, b.value]);
        }
        if (!o[r.k].length) throw new Error(`${r.label} : indiquez les heures, ou décochez le jour.`);
        if (o[r.k].length === 2 && o[r.k][0][1] > o[r.k][1][0]) throw new Error(`${r.label} : les deux plages ne doivent pas se chevaucher.`);
      }
      return o;
    };
    const save = el("button", { class: "btn", id: "id-save", type: "button", text: "Enregistrer ces informations" });
    save.addEventListener("click", async () => {
      err.textContent = ""; ok.textContent = ""; save.disabled = true;
      try {
        const ws = site.value.trim(), ph = phone.value.replace(/[\s.\-()]/g, "");
        if (ws && !/^https:\/\/\S+$/i.test(ws)) throw new Error("Le site doit commencer par https://");
        if (ph && !/^\+?[0-9]{8,15}$/.test(ph)) throw new Error("Numéro de téléphone invalide (8 à 15 chiffres).");
        const upd = { category: cat.value || null, website: ws || null, contact_phone: ph || null, timezone: tz.value, opening_hours: hours() };
        const { error } = await sb.from("merchant_profiles").update(upd).eq("id", state.merchant_id);
        if (error) throw new Error("Enregistrement impossible. Vérifiez les champs.");
        ok.textContent = "Enregistré.";
      } catch (e) { err.textContent = e.message; }
      save.disabled = false;
    });
    return el("div", { id: "identity" }, el("h2", { style: "margin-top:1.1rem", text: "Identité de la page" }),
      el("p", { text: "Tout est facultatif. Ces informations s'affichent en haut de votre page publique." }),
      imgField("logo", "Logo ou photo de profil (carré)", 512, 512, true), imgField("cover", "Photo de couverture (bandeau large)", 1280, 480, false),
      el("label", {}, "Catégorie", catBtn), el("label", {}, "Site web", site), el("label", {}, "Téléphone public (affiché sur votre page, différent de celui de la vérification)", phone),
      el("h2", { style: "margin-top:1.1rem", text: "Horaires d'ouverture" }), el("p", { text: "Cochez les jours d'ouverture (jusqu'à deux plages par jour, ex. midi et soir). Aucun jour coché : pas d'horaires affichés." }),
      ...rows.map((r) => r.row), el("label", {}, "Fuseau horaire", tz), err, ok, save);
  }

  // ---- planning de passage (indépendants itinérants : food trucks, marchés…)
  function scheduleCard() {
    const wrap = el("div", { class: "card hidden", id: "schedule-card" });
    (async () => {
      const { data } = await sb.from("merchant_profiles").select("profile_kind").eq("id", state.merchant_id).single();
      if (!data || data.profile_kind !== "mobile") return;
      wrap.classList.remove("hidden");
      const place = el("input", { type: "text", id: "s-place", maxlength: 120, placeholder: "Ex. Marché de la Halle, parking du stade…" });
      const starts = el("input", { type: "datetime-local", id: "s-start" }), ends = el("input", { type: "datetime-local", id: "s-end" });
      const note = el("input", { type: "text", id: "s-note", maxlength: 200, placeholder: "Facultatif (ex. près de la fontaine)" });
      const err = el("p", { class: "err", id: "s-err" }), list = el("div", { id: "s-list" });
      const SERR = { invalid_place: "Indiquez le lieu (2 caractères minimum).", invalid_slot: "Le créneau doit finir après son début et durer 24 h au plus.", slot_out_of_range: "Choisissez une date à venir, dans les 90 prochains jours.", too_many_slots: "Limite atteinte : 30 passages à venir.", not_mobile: "Réservé aux profils itinérants." };
      const refresh = async () => {
        const { data: rows } = await sb.rpc("list_schedule", { p_merchant: state.merchant_id });
        list.replaceChildren(...(rows || []).map((r) => el("div", { class: "slot", "data-slot": r.id },
          el("div", {}, r.place, el("small", { text: `${fmtDT(r.starts_at)} → ${fmtDT(r.ends_at)}${r.note ? " · " + r.note : ""}` })),
          el("button", { class: "btn danger small", type: "button", "data-del-slot": r.id, text: "Supprimer", onclick: async () => {
            if (!confirm("Supprimer ce passage ?")) return; await sb.rpc("delete_schedule_slot", { p_id: r.id }); refresh();
          } }))));
        if (!(rows || []).length) list.replaceChildren(el("p", { text: "Aucun passage prévu." }));
      };
      const add = el("button", { class: "btn small", id: "s-add", type: "button", text: "Ajouter ce passage", onclick: async () => {
        err.textContent = "";
        if (!starts.value || !ends.value) { err.textContent = "Indiquez le début et la fin."; return; }
        const { error } = await sb.rpc("add_schedule_slot", { p_place: place.value, p_lat: null, p_lng: null, p_starts: new Date(starts.value).toISOString(), p_ends: new Date(ends.value).toISOString(), p_note: note.value || null });
        if (error) { const k = Object.keys(SERR).find((c) => String(error.message).includes(c)); err.textContent = k ? SERR[k] : "Ajout impossible."; return; }
        place.value = ""; note.value = ""; refresh();
      } });
      wrap.append(el("h2", { text: "Planning de passage" }), el("p", { text: "Indiquez où vous serez et quand : vos abonnés le voient sur votre page. Ne mettez pas une adresse privée. Les passages terminés depuis plus d'une semaine sont effacés automatiquement." }),
        el("label", {}, "Lieu", place), el("label", {}, "Début", starts), el("label", {}, "Fin", ends), el("label", {}, "Précision", note), err, add, el("h2", { style: "margin-top:1rem", text: "Passages à venir" }), list);
      refresh();
    })();
    return wrap;
  }

  const mediaUrl = (path) => sb.storage.from("merchant-media").getPublicUrl(path).data.publicUrl;

  // ---- code de parrainage
