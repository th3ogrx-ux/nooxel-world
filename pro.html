<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Espace professionnel — Nooxel World</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="assets/favicon.png?v=2">
  <meta name="theme-color" content="#040b1c">
  <style>
    :root { color-scheme: dark; --blue: #1a6bff; --card: #fff; --ink: #1f1f1f; --mute: #5f6368; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #040b1c; color: #dbe6ff; font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 1.2rem 1rem 5rem; }
    a { color: #6fa8ff; }
    h1 { color: #fff; font-size: 1.6rem; margin: .8rem 0 .2rem; }
    .back { text-decoration: none; }
    .lead { color: #9db4e8; margin: 0 0 1.2rem; }
    .card { background: var(--card); color: var(--ink); border-radius: 20px; padding: 1.1rem 1.2rem; margin: 0 0 1rem; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
    .card h2 { margin: 0 0 .3rem; font-size: 1.15rem; }
    .card p { margin: .3rem 0 .6rem; color: var(--mute); font-size: .95rem; }
    .card .ink { color: var(--ink); }
    label { display: grid; gap: .25rem; margin: .7rem 0 0; font-size: .9rem; color: var(--mute); }
    input[type=text], input[type=url], input[type=tel], select, textarea { font: inherit; font-size: 16px; padding: .7rem .8rem; border: 1px solid #c4c7c5; border-radius: 10px; color: var(--ink); background: #fff; width: 100%; }
    input:focus, textarea:focus { outline: 2px solid rgba(26,107,255,.35); border-color: var(--blue); }
    textarea { min-height: 84px; resize: vertical; }
    button { font: inherit; cursor: pointer; }
    .btn { margin-top: .9rem; padding: .75rem 1.3rem; border: 0; border-radius: 999px; background: var(--blue); color: #fff; font-weight: 600; }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn.ghost { background: #eaf1ff; color: #0b3fa8; }
    .btn.danger { background: #fdecea; color: #b3261e; }
    .btn.small { padding: .45rem .9rem; margin-top: .4rem; font-size: .9rem; }
    .banner { border-radius: 16px; padding: .9rem 1rem; margin: 0 0 1rem; font-size: .95rem; }
    .banner b { display: block; font-size: 1.05rem; margin-bottom: .15rem; }
    .b-none { background: #1b2646; color: #cfe0ff; }
    .b-pending { background: #3a2a05; color: #ffd98a; }
    .b-ok { background: #0d3b24; color: #9bf0c2; }
    .b-pro { background: #0b2d6e; color: #bcd6ff; }
    .b-bad { background: #4a1612; color: #ffc9c4; }
    .badge { display: inline-block; padding: .2rem .7rem; border-radius: 999px; font-size: .8rem; font-weight: 700; }
    .badge.ok { background: #d8f6e5; color: #0d6b3a; } .badge.pro { background: #dbe8ff; color: #0b3fa8; } .badge.none { background: #eceff3; color: #5f6368; } .badge.wait { background: #fff0d1; color: #8a5a00; }
    .row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    .err { color: #b3261e; font-size: .92rem; margin: .5rem 0 0; min-height: 1.2em; }
    .hint { color: var(--mute); font-size: .85rem; margin: .3rem 0 0; min-height: 1.2em; }
    .okmsg { color: #0d6b3a; font-size: .92rem; margin: .5rem 0 0; }
    #siret-ok { color: #8ae6b0; }
    .code { font: 700 1.3rem ui-monospace, monospace; letter-spacing: .12em; background: #f1f5ff; padding: .3rem .7rem; border-radius: 10px; color: #0b3fa8; }
    .hist { list-style: none; margin: .4rem 0 0; padding: 0; }
    .hist li { padding: .45rem 0; border-top: 1px solid #eceff3; font-size: .92rem; color: var(--ink); display: flex; justify-content: space-between; gap: 1rem; }
    .hist li span:last-child { color: var(--mute); white-space: nowrap; font-size: .85rem; }
    .check { display: flex; gap: .6rem; align-items: flex-start; margin-top: .8rem; color: var(--ink); font-size: .9rem; }
    .check input { width: 20px; height: 20px; margin-top: .15rem; flex: none; accent-color: var(--blue); }
    .thumb { max-width: 120px; max-height: 90px; border-radius: 8px; margin-top: .4rem; border: 1px solid #dadce0; }
    .sugg { list-style: none; margin: .3rem 0 0; padding: 0; }
    .sugg li { padding: .55rem .7rem; border-radius: 10px; cursor: pointer; color: var(--ink); font-size: .92rem; }
    .sugg li:hover { background: #eef3ff; }
    .mypost { display: flex; gap: .8rem; padding: .7rem 0; border-top: 1px solid #eceff3; align-items: flex-start; }
    .mypost img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; flex: none; background: #e8eefc; }
    .mypost div { flex: 1; min-width: 0; color: var(--ink); font-size: .92rem; overflow-wrap: anywhere; }
    .mypost small { display: block; color: var(--mute); }
    .kinds { border: 0; padding: 0; margin: .8rem 0 0; } .kinds legend { font-size: .9rem; color: var(--mute); padding: 0; }
    .slot { display: flex; gap: .8rem; padding: .6rem 0; border-top: 1px solid #eceff3; align-items: flex-start; justify-content: space-between; color: var(--ink); font-size: .92rem; }
    .slot small { display: block; color: var(--mute); }
    input[type=datetime-local], input[type=number] { font: inherit; font-size: 16px; padding: .6rem .7rem; border: 1px solid #c4c7c5; border-radius: 10px; color: var(--ink); background: #fff; width: 100%; }
    .thumb.round { border-radius: 50%; width: 96px; height: 96px; object-fit: cover; }
    .hrow { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; padding: .45rem 0; border-top: 1px solid #eceff3; }
    .hslots { display: flex; gap: .3rem; align-items: center; flex-wrap: wrap; color: var(--ink); }
    .hslots input[type=time] { width: auto; padding: .4rem .5rem; font: inherit; font-size: 16px; border: 1px solid #c4c7c5; border-radius: 10px; color: var(--ink); background: #fff; }
    .hidden { display: none !important; }
    details summary { cursor: pointer; font-weight: 600; color: var(--blue); }
    .banner details summary { color: inherit; text-decoration: underline; }
    footer { margin-top: 2rem; font-size: .85rem; color: #7f93bd; }
  </style>
</head>
<body>
<main>
  <a class="back" href="/">← Retour à la carte</a>
  <h1>Espace professionnel</h1>
  <p class="lead" id="lead">Chargement…</p>
  <div id="app"></div>
  <footer>
    <a href="confidentialite.html">Confidentialité</a> · <a href="cgu.html">Conditions</a>
  </footer>
</main>

<script src="assets/vendor/supabase.js"></script>
<script>
  // Clé publique (anon) : conçue pour être exposée côté navigateur.
  const sb = window.supabase ? supabase.createClient(
    "https://smjbgjolteovcwkoxcar.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtamJnam9sdGVvdmN3a294Y2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzM5MzAsImV4cCI6MjEwODcwOTkzMH0.4n1rikyRKt-rVm5FjR4RtTkV8-ip3EbcsNNPy6xCtts"
  ) : null;

  const $ = (id) => document.getElementById(id);
  // Construit des éléments sans jamais interpréter du HTML : tout texte passe par textContent.
  function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(kid));
    return e;
  }
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : "";
  const fmtDT = (d) => d ? new Date(d).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";

  const ERR = {
    email_not_confirmed: "Confirmez d'abord votre adresse email.",
    not_eligible: "Une vérification est déjà en cours ou terminée.",
    too_many_requests: "Trop de demandes récentes. Réessayez plus tard.",
    invalid_phone: "Numéro de téléphone invalide (par exemple 06 12 34 56 78).",
    invalid_social_url: "Indiquez un lien complet vers votre page Instagram, Facebook ou TikTok (https://…).",
    invalid_siret: "Ce numéro SIRET n'est pas valide (14 chiffres).",
    siret_not_checked: "Contrôlez d'abord votre SIRET avec le bouton, ou laissez le champ vide.",
    invalid_referral_code: "Ce code de parrainage n'est pas valide.",
    not_contestable: "Ce refus ne peut plus être contesté.",
    contest_window_closed: "Le délai de 30 jours pour contester est dépassé.",
    message_too_short: "Expliquez votre contestation (10 caractères minimum).",
    another_request_open: "Une autre demande est déjà ouverte.",
    no_profile: "Créez d'abord votre profil.",
    not_verified: "Votre commerce doit d'abord être vérifié.",
    invalid_body: "Écrivez un texte (2 000 caractères au maximum).",
    too_many_posts: "Limite atteinte : 20 publications par 24 heures.",
    image_not_found: "La photo n'a pas été reçue. Réessayez.",
    invalid_duration: "La vidéo doit durer entre 1 et 30 secondes.",
    too_many_videos: "Limite atteinte : 20 vidéos par commerce. Supprimez-en une.",
    too_many_videos_today: "Limite atteinte : 5 nouvelles vidéos par 24 heures.",
    file_not_found: "La vidéo n'a pas été reçue. Réessayez.",
    invalid_file: "Fichier invalide.",
    invalid_image: "Photo invalide.",
  };
  const fr = (e) => { const m = String(e?.message || e || ""); const k = Object.keys(ERR).find((c) => m.includes(c)); return k ? ERR[k] : "Une erreur est survenue. Réessayez dans un instant."; };
  async function fnMessage(error) {                      // message renvoyé par une fonction serveur
    try { const j = await error.context.json(); return j.message || "Erreur."; } catch { return "Le service est indisponible pour le moment."; }
  }

  const HIST = {
    profile_created: "Profil créé", siret_checked: "SIRET contrôlé", submitted: "Demande envoyée", cancelled: "Demande annulée",
    approved: "Demande approuvée", rejected: "Demande refusée", contested: "Contestation envoyée", contest_upheld: "Contestation acceptée",
    contest_dismissed: "Contestation rejetée (décision finale)", document_viewed: "Ancienne pièce consultée par l'équipe de vérification",
    documents_deleted: "Anciennes pièces supprimées", revoked: "Badge retiré",
  };
  const BY = { owner: "vous", admin: "équipe", system: "automatique" };

  let me = null, state = null;

  async function load() {
    if (!sb) { $("lead").textContent = "Service indisponible. Rechargez la page."; return; }
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { $("lead").textContent = ""; $("app").replaceChildren(el("div", { class: "card" }, el("h2", { text: "Connexion requise" }), el("p", { text: "Connectez-vous à votre compte Nooxel pour accéder à l'espace professionnel." }), el("a", { href: "/" , text: "Aller à la connexion" }))); return; }
    const u = await sb.auth.getUser(); me = u.data?.user || session.user;
    const r = await sb.rpc("my_verification_status");
    if (r.error) { $("lead").textContent = "Erreur de chargement."; return; }
    state = r.data;
    render();
  }

  function render() {
    const app = $("app"); app.replaceChildren();
    $("lead").textContent = "Gérez votre commerce et sa vérification.";
    if (!me.email_confirmed_at) app.append(el("div", { class: "banner b-pending" }, el("b", { text: "Email non confirmé" }), "Confirmez votre adresse email pour pouvoir demander une vérification."));
    if (!state.has_profile) { app.append(createCard()); return; }

    const req = state.request, v = state.verification;
    // — bandeau de statut
    if (v === "pending") {
      app.append(el("div", { class: "banner b-pending", id: "status" }, el("b", { text: "En attente de validation" }),
        req?.status === "contested" ? "Votre contestation est en cours d'examen." : `Demande envoyée le ${fmtDate(req?.created_at)}. Nous examinons votre dossier à la main.`));
    } else if (v === "verified") {
      app.append(el("div", { class: "banner b-ok", id: "status" }, el("b", { text: "Professionnel vérifié" }), "Votre profil a été validé par notre équipe. Il est visible en priorité et peut recevoir des avis."));
    } else {
      app.append(el("div", { class: "banner b-none", id: "status" }, el("b", { text: "Non vérifié" }), "Votre profil existe mais avec une visibilité réduite, et il ne peut pas recevoir d'avis."));
    }
    if (req && v !== "pending" && req.status === "rejected") app.append(rejectedBox(req));
    if (req && req.status === "rejected_final") app.append(el("div", { class: "banner b-bad" }, el("b", { text: "Refus définitif" }), "Après réexamen, votre demande n'a pas été acceptée. Motif : ", req.decision_reason || "—", ". Vous pouvez déposer une nouvelle demande avec de nouveaux éléments."));

    app.append(profileCard());
    if (v === "pending" && req && ["pending", "contested"].includes(req.status)) app.append(pendingCard(req));
    if (v === "verified") app.append(pageCard(), scheduleCard(), postsCard(), videosCard(), referralCard());
    else app.append(el("div", { class: "card", id: "page-soon" }, el("h2", { text: "Votre page publique" }), el("p", { text: "Une fois votre commerce vérifié, vous aurez une page visible par tous : vos publications, vos abonnés, votre adresse sur la carte." })));
    if (v === "none") app.append(requestCard());
    if (state.history?.length) app.append(historyCard());
    if (location.hash.length > 1) setTimeout(() => { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }, 400);
  }

  // ---- création du profil
  function createCard() {
    const err = el("p", { class: "err", id: "c-err" }); const name = el("input", { type: "text", id: "c-name", maxlength: 120, autocomplete: "organization", required: true });
    const desc = el("textarea", { id: "c-desc", maxlength: 1000, placeholder: "Ce que vous proposez, vos horaires…" });
    const btn = el("button", { class: "btn", type: "submit", text: "Créer mon profil" });
    const f = el("form", { class: "card", id: "create-form", onsubmit: async (e) => {
      e.preventDefault(); err.textContent = ""; btn.disabled = true;
      const n = name.value.trim();
      if (n.length < 2) { err.textContent = "Indiquez le nom de votre commerce (2 caractères minimum)."; btn.disabled = false; return; }
      const kind = document.querySelector("input[name=kind]:checked").value;
      const { error } = await sb.from("merchant_profiles").insert({ owner_id: me.id, business_name: n, description: desc.value.trim() || null, profile_kind: kind }).select().single();
      btn.disabled = false;
      if (error) { err.textContent = /duplicate|unique/i.test(error.message) ? "Vous avez déjà un profil professionnel." : "Impossible de créer le profil."; return; }
      await load();
    } },
      el("h2", { text: "Créer mon profil professionnel" }),
      el("p", { text: "Aucun justificatif n'est demandé pour créer le profil. Sans vérification, la visibilité est réduite et les avis sont désactivés." }),
      el("label", {}, "Nom du commerce", name), el("label", {}, "Description (facultatif)", desc),
      el("fieldset", { class: "kinds" }, el("legend", { text: "Type de profil" }),
        el("label", { class: "check" }, el("input", { type: "radio", name: "kind", id: "k-shop", value: "shop", checked: true }), el("span", { text: "Commerce avec une adresse (boutique, restaurant, atelier…)" })),
        el("label", { class: "check" }, el("input", { type: "radio", name: "kind", id: "k-mobile", value: "mobile" }), el("span", { text: "Indépendant ou itinérant, sans boutique (coiffeur à domicile, food truck, artisan, freelance…) : vous indiquez une zone d'intervention, jamais une adresse personnelle." }))),
      err, btn);
    return f;
  }

  // ---- fiche du profil + modification
  function profileCard() {
    const err = el("p", { class: "err" }), ok = el("p", { class: "okmsg" });
    const name = el("input", { type: "text", id: "e-name", maxlength: 120, value: state.business_name });
    const desc = el("textarea", { id: "e-desc", maxlength: 1000 }); desc.value = "";
    const badge = { verified: ["ok", "Professionnel vérifié"], pending: ["wait", "En attente"] }[state.verification] || ["none", "Non vérifié"];
    const form = el("form", { class: "hidden", id: "edit-form", onsubmit: async (e) => {
      e.preventDefault(); err.textContent = ""; ok.textContent = "";
      const { error } = await sb.from("merchant_profiles").update({ business_name: name.value.trim(), description: desc.value.trim() || null }).eq("id", state.merchant_id);
      if (error) { err.textContent = "Modification impossible."; return; }
      ok.textContent = "Enregistré."; state.business_name = name.value.trim(); title.textContent = state.business_name;
    } }, el("label", {}, "Nom du commerce", name), el("label", {}, "Description", desc), err, ok, el("button", { class: "btn small", type: "submit", text: "Enregistrer" }));
    const title = el("h2", { class: "ink", text: state.business_name, id: "p-name" });
    sb.from("merchant_profiles").select("description").eq("id", state.merchant_id).single().then(({ data }) => { if (data) desc.value = data.description || ""; });
    return el("div", { class: "card" }, el("div", { class: "row" }, title, el("span", { class: "badge " + badge[0], text: badge[1] })),
      el("button", { class: "btn ghost small", type: "button", text: "Modifier", onclick: () => form.classList.toggle("hidden") }), form);
  }

  // ---- demande en cours
  function pendingCard(req) {
    const err = el("p", { class: "err" });
    return el("div", { class: "card", id: "pending-card" }, el("h2", { text: "Votre demande" }),
      el("p", { text: "Un membre de l'équipe examine votre demande et regarde votre page. Réponse sous quelques jours." }),
      el("ul", { class: "hist" },
        req.social_url ? el("li", {}, el("span", { text: "Page" }), el("span", { text: req.social_url })) : null,
        req.phone_end ? el("li", {}, el("span", { text: "Téléphone" }), el("span", { text: "se termine par " + req.phone_end })) : null,
        req.has_siret ? el("li", {}, el("span", { text: "SIRET" }), el("span", { text: req.company_name ? "contrôlé : " + req.company_name : "contrôlé" })) : null),
      req.status === "pending" ? el("button", { class: "btn danger small", id: "cancel-btn", type: "button", text: "Annuler la demande", onclick: async () => {
        if (!confirm("Annuler la demande ? Le téléphone et le lien envoyés seront effacés.")) return;
        const { error } = await sb.rpc("cancel_verification", { p_request_id: req.id });
        if (error) { err.textContent = fr(error); return; } await load();
      } }) : null, err);
  }

  // ---- refus + contestation
  function rejectedBox(req) {
    const box = el("div", { class: "banner b-bad", id: "rejected" }, el("b", { text: "Demande refusée" }), "Motif : ", req.decision_reason || "—");
    if (req.can_contest) {
      const msg = el("textarea", { id: "contest-msg", maxlength: 2000, placeholder: "Expliquez pourquoi ce refus vous semble injuste, ajoutez les précisions utiles…" });
      const err = el("p", { class: "err", style: "color:#ffc9c4" });
      box.append(el("details", {}, el("summary", { text: "Contester ce refus" }), el("p", { text: "Un autre membre de l'équipe réexaminera votre dossier. Vous ne pouvez contester qu'une fois." }), msg,
        el("button", { class: "btn small", id: "contest-btn", type: "button", text: "Envoyer la contestation", onclick: async () => {
          err.textContent = ""; const { error } = await sb.rpc("contest_verification", { p_request_id: req.id, p_message: msg.value });
          if (error) { err.textContent = fr(error); return; } await load();
        } }), err));
    } else if (req.contested_at) box.append(el("p", { text: "Contestation envoyée." }));
    return box;
  }

  // ---- demande de vérification (examinée à la main)
  function requestCard() {
    const phone = el("input", { type: "tel", id: "f-phone", autocomplete: "tel", placeholder: "06 12 34 56 78", maxlength: 24 });
    const social = el("input", { type: "url", id: "f-social", placeholder: "https://instagram.com/votre_commerce", maxlength: 300 });
    const siret = el("input", { type: "text", id: "siret", inputmode: "numeric", autocomplete: "off", placeholder: "14 chiffres (facultatif)", maxlength: 20 });
    const ref = el("input", { type: "text", id: "f-ref", placeholder: "Facultatif", maxlength: 12, autocapitalize: "characters" });
    const cons = el("input", { type: "checkbox", id: "f-consent" });
    const sErr = el("p", { class: "err", id: "siret-err" }), sOk = el("p", { class: "okmsg", id: "siret-ok" });
    const err = el("p", { class: "err", id: "req-err" });
    const sBtn = el("button", { class: "btn ghost small", id: "siret-btn", type: "button", text: "Contrôler ce SIRET" });
    const btn = el("button", { class: "btn", id: "req-btn", type: "button", text: "Envoyer ma demande" });
    let checked = "";
    const digits = () => siret.value.replace(/\s/g, "");
    siret.addEventListener("input", () => { if (digits() !== checked) { checked = ""; sOk.textContent = ""; } });
    sBtn.addEventListener("click", async () => {
      sErr.textContent = ""; sOk.textContent = ""; sBtn.disabled = true; sBtn.textContent = "Contrôle…";
      const { data, error } = await sb.functions.invoke("verify-siret", { body: { siret: siret.value } });
      sBtn.disabled = false; sBtn.textContent = "Contrôler ce SIRET";
      if (error) { sErr.textContent = await fnMessage(error); return; }
      if (!data?.ok) { sErr.textContent = data?.message || "Contrôle impossible."; return; }
      checked = digits(); err.textContent = ""; sOk.textContent = "✓ Entreprise trouvée" + (data.company ? " : " + data.company : "") + ". Elle sera jointe à votre demande.";
    });
    btn.addEventListener("click", async () => {
      err.textContent = "";
      if (!me.email_confirmed_at) { err.textContent = ERR.email_not_confirmed; return; }
      if (digits() && digits() !== checked) { err.textContent = ERR.siret_not_checked; return; }

    catch { src = await new Promise((ok, no) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("Impossible de lire cette image.")); i.src = u; }); }

        el("button", { class: "btn danger small", type: "button", "data-del": p.id, text: "Supprimer", onclick: async () => {
          if (!confirm("Supprimer cette publication ?")) return;
          const r = await sb.rpc("delete_post", { p_post: p.id });
          if (r.error) { err.textContent = fr(r.error); return; }
          if (r.data) await sb.storage.from("merchant-media").remove([r.data]);
          refresh();
        } }))));
    };
    btn.addEventListener("click", async () => {
      err.textContent = ""; ok.textContent = "";
      if (!body.value.trim()) { err.textContent = ERR.invalid_body; return; }
      btn.disabled = true; btn.textContent = "Publication…"; let path = null;
      try {
        if (photo.files[0]) {
          const blob = await shrink(photo.files[0]); path = `${state.merchant_id}/${crypto.randomUUID()}.jpg`;
          const up = await sb.storage.from("merchant-media").upload(path, blob, { contentType: "image/jpeg", upsert: false }); if (up.error) throw up.error;
        }
        const r = await sb.rpc("create_post", { p_body: body.value, p_image_path: path });
        if (r.error) { if (path) await sb.storage.from("merchant-media").remove([path]); throw r.error; }
        body.value = ""; photo.value = ""; th.classList.add("hidden"); ok.textContent = "Publié !"; refresh();
      } catch (e) { err.textContent = e instanceof Error && !e.message.includes("_") ? e.message : fr(e); }
      btn.disabled = false; btn.textContent = "Publier";
    });
    refresh();
    return el("div", { class: "card", id: "posts-card" }, el("h2", { text: "Publier sur ma page" }),
      el("p", { text: "Une photo (facultative) et un texte. Vos abonnés les voient dans leur fil d'actualité." }),
      el("label", {}, "Texte", body), el("label", {}, "Photo (facultative)", photo, th), err, ok, btn,
      el("h2", { style: "margin-top:1.1rem", text: "Mes publications" }), mine);
  }

  // ---- vidéos courtes : réduites dans le navigateur (480p, ~1 Mo pour 10 s) avant l'envoi, pour ménager les forfaits mobiles
  const MAX_VIDEO_S = 30, MAX_VIDEO_BYTES = 5.9 * 1024 * 1024, SMALL_ENOUGH = 3.5 * 1024 * 1024;
  const waitFor = (el, ok, no = "error") => new Promise((res, rej) => { el.addEventListener(ok, () => res(), { once: true }); el.addEventListener(no, () => rej(new Error("unreadable")), { once: true }); });
  function recorderType() {
    if (!window.MediaRecorder) return null;
    return ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find((t) => MediaRecorder.isTypeSupported(t)) || null;
  }
  // Renvoie { blob, ext, duration, poster }. force = true : réencode même un petit fichier.
  async function optimizeVideo(file, onProgress, force = false) {
    const url = URL.createObjectURL(file), v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
    try {
      await waitFor(v, "loadedmetadata");
      if (v.duration === Infinity) {      // vidéos enregistrées par un navigateur : durée absente du fichier, on la fait calculer
        v.currentTime = 1e7; await Promise.race([waitFor(v, "timeupdate"), new Promise((r) => setTimeout(r, 4000))]);
        v.currentTime = 0; await waitFor(v, "seeked").catch(() => {});
      }
      const dur = v.duration;
      if (!isFinite(dur) || dur < 1) throw new Error("unreadable");
      if (dur > MAX_VIDEO_S + 0.5) { const e = new Error("too_long"); e.seconds = Math.round(dur); throw e; }
      // vignette : une image de la vidéo (petite, ~30 Ko)
      v.currentTime = Math.min(0.5, dur / 2); await waitFor(v, "seeked");
      const pk = Math.min(1, 480 / v.videoWidth), pc = document.createElement("canvas"); pc.width = Math.round(v.videoWidth * pk); pc.height = Math.round(v.videoHeight * pk);
      pc.getContext("2d").drawImage(v, 0, 0, pc.width, pc.height);
      const poster = await new Promise((r) => pc.toBlob(r, "image/jpeg", 0.72));
      const ext0 = /mp4/.test(file.type) ? "mp4" : /webm/.test(file.type) ? "webm" : null;
      if (!force && ext0 && file.size <= SMALL_ENOUGH) return { blob: file, ext: ext0, duration: Math.max(1, Math.round(dur)), poster, type: file.type.split(";")[0] };
      const type = recorderType(); if (!type) throw new Error("unsupported");
      const k = Math.min(1, 854 / Math.max(v.videoWidth, v.videoHeight), 480 / Math.min(v.videoWidth, v.videoHeight));
      const w = Math.max(2, Math.round(v.videoWidth * k / 2) * 2), h = Math.max(2, Math.round(v.videoHeight * k / 2) * 2);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const ctx = cv.getContext("2d");
      const stream = cv.captureStream(24); let ac = null;
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); const src = ac.createMediaElementSource(v), dest = ac.createMediaStreamDestination(); src.connect(dest); dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t)); v.muted = false; } catch (e) { ac = null; }
      const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 900000, audioBitsPerSecond: 64000 }), chunks = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      const stopped = new Promise((r) => { rec.onstop = r; });
      v.currentTime = 0; await waitFor(v, "seeked").catch(() => {});
      rec.start(500); await v.play();
      let raf; const draw = () => { ctx.drawImage(v, 0, 0, w, h); onProgress && onProgress(Math.min(1, v.currentTime / dur)); raf = requestAnimationFrame(draw); }; draw();
      await Promise.race([waitFor(v, "ended"), new Promise((r) => setTimeout(r, (dur + 6) * 1000))]);
      cancelAnimationFrame(raf); rec.stop(); await stopped; if (ac) ac.close().catch(() => {});
      const blob = new Blob(chunks, { type: type.split(";")[0] });
      return { blob, ext: /mp4/.test(type) ? "mp4" : "webm", duration: Math.max(1, Math.round(dur)), poster, type: type.split(";")[0] };
    } finally { URL.revokeObjectURL(url); v.removeAttribute("src"); }
  }

  function videosCard() {
    const file = el("input", { type: "file", id: "v-file", accept: "video/*" }), cap = el("input", { type: "text", id: "v-caption", maxlength: 300, placeholder: "Légende (facultatif)" });
    const err = el("p", { class: "err", id: "v-err" }), ok = el("p", { class: "okmsg", id: "v-ok" }), prog = el("p", { class: "hint", id: "v-progress" });
    const mine = el("div", { id: "my-videos" }), btn = el("button", { class: "btn", id: "v-publish", type: "button", text: "Publier la vidéo" });
    const refresh = async () => {
      const { data } = await sb.rpc("list_merchant_videos", { p_merchant: state.merchant_id, p_limit: 30 });
      mine.replaceChildren(...(data || []).map((v) => el("div", { class: "mypost", "data-video": v.id },
        el("img", { src: mediaUrl(v.poster_path), alt: "", loading: "lazy" }),
        el("div", {}, (v.caption || "Vidéo") + " · " + v.duration_s + " s", el("small", { text: fmtDT(v.created_at) })),
        el("button", { class: "btn danger small", type: "button", "data-del-video": v.id, text: "Supprimer", onclick: async () => {
          if (!confirm("Supprimer cette vidéo ?")) return;
          const r = await sb.rpc("delete_video", { p_video: v.id }); if (r.error) { err.textContent = fr(r.error); return; }
          if (r.data) { await sb.storage.from("merchant-videos").remove([r.data.video_path]); await sb.storage.from("merchant-media").remove([r.data.poster_path]); }
          refresh();
        } }))));
    };
    btn.addEventListener("click", async () => {
      err.textContent = ""; ok.textContent = ""; prog.textContent = "";
      const f = file.files[0]; if (!f) { err.textContent = "Choisissez une vidéo."; return; }
      btn.disabled = true; btn.textContent = "Préparation…"; let vp = null, pp = null;
      try {
        const out = await optimizeVideo(f, (p) => { prog.textContent = `Optimisation de la vidéo… ${Math.round(p * 100)} % (gardez cet écran ouvert)`; });
        if (out.blob.size > MAX_VIDEO_BYTES) throw new Error("too_big");
        prog.textContent = "Envoi…"; btn.textContent = "Envoi…";
        const id = crypto.randomUUID(), base = `${state.merchant_id}/${id}`; vp = `${base}.${out.ext}`; pp = `${base}.jpg`;
        let up = await sb.storage.from("merchant-videos").upload(vp, out.blob, { contentType: out.type, upsert: false }); if (up.error) throw up.error;
        up = await sb.storage.from("merchant-media").upload(pp, out.poster, { contentType: "image/jpeg", upsert: false }); if (up.error) throw up.error;
        const r = await sb.rpc("create_video", { p_caption: cap.value, p_video_path: vp, p_poster_path: pp, p_duration: out.duration });
        if (r.error) throw r.error;
        file.value = ""; cap.value = ""; prog.textContent = ""; ok.textContent = "Vidéo publiée !"; refresh();
      } catch (e) {
        if (vp) await sb.storage.from("merchant-videos").remove([vp]).catch(() => {}); if (pp) await sb.storage.from("merchant-media").remove([pp]).catch(() => {});
        prog.textContent = ""; const m = String(e && e.message || e);
        err.textContent = m === "too_long" ? `Cette vidéo dure ${e.seconds} s : 30 secondes au maximum. Raccourcissez-la puis réessayez.`
          : m === "too_big" ? "Cette vidéo reste trop lourde (6 Mo maximum) même après réduction : raccourcissez-la."
          : m === "unsupported" ? "Ce navigateur ne sait pas réduire les vidéos. Essayez avec Chrome, ou une vidéo déjà légère (moins de 3 Mo)."
          : m === "unreadable" ? "Impossible de lire cette vidéo. Essayez un autre fichier (MP4 de préférence)." : fr(e);
      }
      btn.disabled = false; btn.textContent = "Publier la vidéo";
    });
    refresh();
    return el("div", { class: "card", id: "videos-card" }, el("h2", { text: "Publier une vidéo" }),
      el("p", { text: "30 secondes au maximum, au format vertical de préférence. La vidéo est réduite automatiquement (480p) pour rester légère : comptez la durée de la vidéo pour l'optimisation, sans quitter cet écran. 20 vidéos au maximum." }),
      el("label", {}, "Vidéo", file), el("label", {}, "Légende", cap), prog, err, ok, btn,
      el("h2", { style: "margin-top:1.1rem", text: "Mes vidéos" }), mine);
  }

  // ---- code de parrainage
  function referralCard() {
    const code = state.referral_code || "—";
    return el("div", { class: "card" }, el("h2", { text: "Votre code de parrainage" }),
      el("p", { text: "Donnez-le à un autre commerçant : notre équipe le verra comme une recommandation de votre part. Il ne valide rien automatiquement." }),
      el("span", { class: "code", id: "ref-code", text: code }));
  }

  // ---- historique
  function historyCard() {
    return el("div", { class: "card" }, el("h2", { text: "Historique" }),
      el("ul", { class: "hist", id: "history" }, state.history.map((h) => el("li", {}, el("span", { text: HIST[h.action] || h.action }), el("span", { text: `${fmtDT(h.at)} · ${BY[h.by] || ""}` })))));
  }

  load();
</script>
