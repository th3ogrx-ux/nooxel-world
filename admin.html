<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Administration — Nooxel World</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="assets/favicon.png">
  <style>
    :root { color-scheme: light; --blue: #1a6bff; --ink: #1f1f1f; --mute: #5f6368; --line: #e3e6ea; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f4f8; color: var(--ink); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
    header { background: #040b1c; color: #fff; padding: .8rem 1rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
    header b { letter-spacing: .12em; text-transform: uppercase; font-size: .85rem; }
    header span { color: #9db4e8; font-size: .85rem; margin-left: auto; }
    nav { display: flex; gap: .4rem; }
    nav button { border: 0; background: rgba(255,255,255,.1); color: #fff; padding: .45rem .9rem; border-radius: 999px; font: inherit; cursor: pointer; }
    nav button.on { background: var(--blue); }
    main { max-width: 900px; margin: 0 auto; padding: 1rem 1rem 4rem; }
    .card { background: #fff; border-radius: 16px; padding: 1rem 1.1rem; margin: 0 0 .9rem; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .top { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    h2 { margin: 0; font-size: 1.1rem; }
    .meta { color: var(--mute); font-size: .88rem; margin: .15rem 0; }
    .pill { display: inline-block; padding: .1rem .6rem; border-radius: 999px; font-size: .78rem; font-weight: 700; background: #eceff3; color: var(--mute); }
    .pill.warn { background: #fff0d1; color: #8a5a00; } .pill.ok { background: #d8f6e5; color: #0d6b3a; } .pill.bad { background: #fde1de; color: #b3261e; } .pill.blue { background: #dbe8ff; color: #0b3fa8; }
    .box { background: #f6f8fc; border-radius: 12px; padding: .6rem .8rem; margin: .6rem 0; font-size: .92rem; }
    .box.contest { background: #fff7e6; }
    button { font: inherit; cursor: pointer; }
    .btn { padding: .5rem 1rem; border: 0; border-radius: 999px; background: var(--blue); color: #fff; font-weight: 600; }
    .btn.ghost { background: #eaf1ff; color: #0b3fa8; } .btn.red { background: #d93025; } .btn.green { background: #188038; } .btn.light { background: #eceff3; color: var(--ink); }
    .btn:disabled { opacity: .5; cursor: default; }
    .actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .6rem; }
    textarea, input[type=text], input[type=search] { font: inherit; padding: .55rem .7rem; border: 1px solid #c4c7c5; border-radius: 10px; width: 100%; }
    .err { color: #b3261e; margin: .4rem 0 0; min-height: 1.2em; }
    .empty { color: var(--mute); text-align: center; padding: 2rem 1rem; }
    .hidden { display: none !important; }
    #viewer { position: fixed; inset: 0; background: rgb(4,11,28); z-index: 20; display: grid; place-items: center; padding: 1rem; }
    #viewer .frame { position: relative; max-width: min(92vw, 900px); max-height: 88vh; }
    #viewer img { max-width: 100%; max-height: 82vh; border-radius: 10px; display: block; user-select: none; -webkit-user-drag: none; }
    #viewer .wm { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: difference; opacity: .5; background-repeat: repeat; }
    #viewer .bar { color: #fff; display: flex; justify-content: space-between; gap: 1rem; margin-bottom: .5rem; font-size: .9rem; }
    #viewer button { background: #fff; color: var(--ink); border: 0; border-radius: 999px; padding: .35rem .9rem; }
    .gate { max-width: 440px; margin: 2rem auto; text-align: center; }
    .gate ol { text-align: left; padding-left: 1.2rem; color: var(--mute); font-size: .92rem; }
    .gate .qr { width: 210px; height: 210px; margin: .6rem auto; display: block; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
    .gate .secret { font-family: ui-monospace, monospace; word-break: break-all; background: #f6f8fc; padding: .45rem .6rem; border-radius: 8px; font-size: .88rem; user-select: all; }
    .gate input[type=text] { text-align: center; font-size: 1.6rem; letter-spacing: .4em; padding: .6rem; margin-top: .6rem; }
    .search { display: flex; gap: .5rem; margin-bottom: .8rem; }
    .search input { flex: 1; }
  </style>
</head>
<body>
<header>
  <b>Nooxel · Administration</b>
  <nav>
    <button id="tab-review" class="on">À examiner</button>
    <button id="tab-history">Historique</button>
    <button id="tab-merchants">Commerçants</button>
  </nav>
  <span id="who"></span>
</header>
<main id="main"><p class="empty">Chargement…</p></main>

<div id="viewer" class="hidden" role="dialog" aria-modal="true" aria-label="Pièce justificative">
  <div class="frame">
    <div class="bar"><span id="v-title"></span><span><span id="v-count"></span> <button id="v-close" type="button">Fermer</button></span></div>
    <img id="v-img" alt="Pièce justificative" referrerpolicy="no-referrer" draggable="false">
    <div class="wm" id="v-wm" aria-hidden="true"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // Clé publique (anon). Le droit d'administrateur est vérifié CÔTÉ SERVEUR à chaque appel : cette page n'est qu'une façade.
  const sb = window.supabase ? supabase.createClient(
    "https://smjbgjolteovcwkoxcar.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtamJnam9sdGVvdmN3a294Y2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzM5MzAsImV4cCI6MjEwODcwOTkzMH0.4n1rikyRKt-rVm5FjR4RtTkV8-ip3EbcsNNPy6xCtts"
  ) : null;
  const $ = (id) => document.getElementById(id);
  function el(tag, props, ...kids) {              // aucun HTML interprété : tout texte passe par textContent
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(kid));
    return e;
  }
  const fmt = (d) => d ? new Date(d).toLocaleString("fr-FR", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
  const STATUS = { pending: ["En attente", "warn"], contested: ["Contestée", "warn"], approved: ["Approuvée", "ok"], rejected: ["Refusée", "bad"], rejected_final: ["Refus définitif", "bad"], cancelled: ["Annulée", ""] };
  const LEVEL = { none: ["Non vérifié", ""], pending: ["En attente", "warn"], company_verified: ["Entreprise vérifiée", "ok"], profile_confirmed: ["Profil confirmé", "blue"] };
  const ERR = {
    forbidden: "Accès refusé : ce compte n'est pas administrateur.", not_pending: "Cette demande a déjà été traitée.", not_contested: "Cette demande n'est pas en contestation.",
    reason_required: "Indiquez un motif (5 caractères minimum).", cannot_review_own_request: "Vous ne pouvez pas traiter votre propre demande.",
    another_admin_must_review: "Une contestation doit être jugée par un autre administrateur.", nothing_to_revoke: "Ce profil n'a aucun badge à retirer.",
    documents_deleted: "Les pièces ont déjà été supprimées.", not_found: "Introuvable.",
  };
  const fr = (e) => { const m = String(e?.message || e || ""); const k = Object.keys(ERR).find((c) => m.includes(c)); return k ? ERR[k] : "Erreur : " + m.slice(0, 120); };

  let tab = "review", me = null;

  // ---------- Double authentification (TOTP) : obligatoire pour toute action d'administrateur ----------
  // La règle est imposée par la base de données (is_admin() exige aal2) ; cet écran ne fait que demander le code.
  function gateCard(...kids) { $("main").replaceChildren(el("div", { class: "card gate" }, ...kids)); }
  function codeForm(label, onSubmit) {
    const input = el("input", { type: "text", id: "mfa-code", inputmode: "numeric", autocomplete: "one-time-code", maxlength: 6, placeholder: "000000", "aria-label": "Code à 6 chiffres" });
    const err = el("p", { class: "err", id: "mfa-err" }), btn = el("button", { class: "btn", id: "mfa-btn", type: "submit", text: label });
    const form = el("form", { onsubmit: async (e) => {
      e.preventDefault(); err.textContent = ""; const code = input.value.replace(/\s/g, "");
      if (!/^[0-9]{6}$/.test(code)) { err.textContent = "Saisissez les 6 chiffres affichés par l'application."; return; }
      btn.disabled = true; try { await onSubmit(code); } catch (x) { err.textContent = "Code incorrect ou expiré. Réessayez avec le code actuel."; btn.disabled = false; input.select(); }
    } }, input, err, btn);
    return { form, input };
  }
  async function askCode(factorId) {
    return new Promise((done) => {
      const f = codeForm("Valider", async (code) => {
        const { error } = await sb.auth.mfa.challengeAndVerify({ factorId, code }); if (error) throw error; done(true);
      });
      gateCard(el("h2", { text: "Code de vérification" }), el("p", { class: "meta", text: "Ouvrez votre application d'authentification et saisissez le code à 6 chiffres de « Nooxel »." }), f.form); f.input.focus();
    });
  }
  async function enrollFactor(all) {
    for (const x of all) if (x.status !== "verified") await sb.auth.mfa.unenroll({ factorId: x.id });   // restes d'une configuration abandonnée
    const { data, error } = await sb.auth.mfa.enroll({ factorType: "totp", issuer: "Nooxel", friendlyName: "Nooxel admin " + Date.now() });
    if (error) throw error;
    return new Promise((done) => {
      const f = codeForm("Activer la protection", async (code) => {
        const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: data.id, code }); if (error) throw error; done(true);
      });
      gateCard(el("h2", { text: "Protégez votre compte administrateur" }),
        el("p", { class: "meta", text: "Ce compte voit des pièces d'identité : un second verrou est obligatoire." }),
        el("ol", {}, el("li", { text: "Installez une application d'authentification (Google Authenticator, Microsoft Authenticator, 2FAS…)." }), el("li", { text: "Scannez ce code avec l'application." }), el("li", { text: "Saisissez le code à 6 chiffres qu'elle affiche." })),
        el("img", { class: "qr", id: "mfa-qr", alt: "QR code à scanner", src: data.totp.qr_code }),
        el("p", { class: "meta", text: "Impossible de scanner ? Saisissez cette clé à la main. Conservez-la : elle permet de reconfigurer l'application si vous changez de téléphone." }),
        el("div", { class: "secret", id: "mfa-secret", text: data.totp.secret }), f.form);
      f.input.focus();
    });
  }
  async function gate() {
    const { data: lvl, error } = await sb.auth.mfa.getAuthenticatorAssuranceLevel(); if (error) throw error;
    if (lvl.currentLevel === "aal2") return;
    const { data: f } = await sb.auth.mfa.listFactors();
    const verified = (f?.totp || [])[0];
    if (verified) await askCode(verified.id); else await enrollFactor(f?.all || []);
  }

  async function boot() {
    if (!sb) { $("main").replaceChildren(el("p", { class: "empty", text: "Service indisponible. Rechargez la page." })); return; }
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { $("main").replaceChildren(el("p", { class: "empty" }, "Connectez-vous d'abord sur ", el("a", { href: "/", text: "Nooxel World" }), ", puis revenez ici.")); return; }
    me = session.user; $("who").textContent = me.email || "";
    const who = await sb.rpc("am_i_admin");
    if (who.error || !who.data) { $("main").replaceChildren(el("p", { class: "empty", text: "Accès refusé : ce compte n'est pas administrateur." })); return; }
    try { await gate(); } catch { $("main").replaceChildren(el("p", { class: "empty", text: "Impossible de vérifier la double authentification. Rechargez la page." })); return; }
    show("review");
  }

  document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => show(b.id.replace("tab-", ""))));
  function show(t) {
    tab = t;
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.id === "tab-" + t));
    if (t === "merchants") return merchants(); return requests(t === "review" ? "to_review" : "all");
  }

  // ---------- Demandes ----------
  async function requests(filter) {
    const main = $("main"); main.replaceChildren(el("p", { class: "empty", text: "Chargement…" }));
    const { data, error } = await sb.rpc("admin_list_requests", { p_status: filter });
    if (error) { main.replaceChildren(el("p", { class: "empty", text: fr(error) })); return; }
    if (!data.length) { main.replaceChildren(el("p", { class: "empty", text: filter === "to_review" ? "Rien à examiner. 🎉" : "Aucune demande." })); return; }
    main.replaceChildren(...data.map(card));
  }

  function card(r) {
    const st = STATUS[r.status] || [r.status, ""], open = ["pending", "contested"].includes(r.status);
    const err = el("p", { class: "err" });
    const c = el("div", { class: "card", "data-id": r.id },
      el("div", { class: "top" }, el("div", {}, el("h2", { text: r.merchant.business_name }), el("p", { class: "meta", text: `${r.owner_email}${r.email_confirmed ? " · email confirmé" : " · EMAIL NON CONFIRMÉ"}` })),
        el("div", {}, el("span", { class: "pill " + st[1], text: st[0] }), " ", el("span", { class: "meta", text: fmt(r.created_at) }))),
      r.merchant.description ? el("p", { class: "meta", text: r.merchant.description }) : null,
      el("div", { class: "box" },
        el("div", {}, "Profil social : ", r.social_url ? el("a", { href: r.social_url, target: "_blank", rel: "noopener noreferrer nofollow", text: r.social_url }) : "non renseigné"),
        el("div", {}, "Parrainage : ", r.referrer ? `recommandé par « ${r.referrer.business_name} » (${(LEVEL[r.referrer.verification] || [""])[0]})` : "aucun"),
        el("div", {}, `Demandes précédentes : ${r.previous_requests}`)),
      r.status === "contested" || r.contest_message ? el("div", { class: "box contest" }, el("b", { text: "Contestation : " }), r.contest_message || "", r.decision_reason ? el("div", { class: "meta", text: "Refus initial : " + r.decision_reason }) : null) : null,
      !open && r.decision_reason ? el("div", { class: "box" }, "Motif de la décision : ", r.decision_reason) : null);
    if (r.has_documents) {
      c.append(el("div", { class: "actions" },
        el("button", { class: "btn ghost", type: "button", "data-doc": "id", text: "Voir la pièce d'identité", onclick: () => viewDoc(r, "id", err) }),
        el("button", { class: "btn ghost", type: "button", "data-doc": "selfie", text: "Voir la photo", onclick: () => viewDoc(r, "selfie", err) })));
    } else if (r.docs_deleted_at) c.append(el("p", { class: "meta", text: `Pièces supprimées le ${fmt(r.docs_deleted_at)}.` }));
    if (open) c.append(decision(r, err));
    c.append(err);
    return c;
  }

  function decision(r, err) {
    const reason = el("textarea", { rows: 2, placeholder: r.status === "contested" ? "Motif de la décision (obligatoire)" : "Motif (obligatoire en cas de refus, il sera montré au commerçant)", "data-reason": true });
    const run = async (approve) => {
      err.textContent = "";
      if (!approve || r.status === "contested") { if (reason.value.trim().length < 5) { err.textContent = ERR.reason_required; return; } }
      if (!confirm(approve ? "Approuver cette demande ?" : (r.status === "contested" ? "Rejeter définitivement la contestation ?" : "Refuser cette demande ?"))) return;
      const call = r.status === "contested"
        ? sb.rpc("admin_decide_contest", { p_request_id: r.id, p_approve: approve, p_reason: reason.value })
        : sb.rpc("admin_decide", { p_request_id: r.id, p_approve: approve, p_reason: reason.value || null });
      const { error } = await call; if (error) { err.textContent = fr(error); return; } show(tab);
    };
    const contested = r.status === "contested";
    return el("div", {}, reason, el("div", { class: "actions" },
      el("button", { class: "btn green", type: "button", "data-act": "approve", text: contested ? "Accepter la contestation" : "Approuver", onclick: () => run(true) }),
      el("button", { class: "btn red", type: "button", "data-act": "reject", text: contested ? "Rejeter définitivement" : "Refuser", onclick: () => run(false) })));
  }

  // ---------- Visionneuse (lien de 60 s, journalisé côté serveur) ----------
  let timer = null, tick = null;
  async function viewDoc(r, which, err) {
    err.textContent = "";
    const { data, error } = await sb.functions.invoke("admin-document-url", { body: { request_id: r.id, which } });
    if (error) { let m = "Impossible d'afficher la pièce."; try { m = (await error.context.json()).message || m; } catch {} err.textContent = m; return; }
    // Filigrane répété sur toute l'image, avec l'email de l'administrateur : visible sur fond clair comme sombre.
    const mark = ((me && me.email) || "administrateur").replace(/[<>&"']/g, "");
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150"><text x="150" y="75" text-anchor="middle" transform="rotate(-24 150 75)" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">NOOXEL · VÉRIFICATION</text><text x="150" y="98" text-anchor="middle" transform="rotate(-24 150 75)" font-family="Arial,sans-serif" font-size="14" fill="#fff">${mark}</text></svg>`;
    $("v-wm").style.backgroundImage = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
    $("v-title").textContent = `${r.merchant.business_name} — ${which === "id" ? "pièce d'identité" : "photo"}`;
    $("v-img").src = data.url; $("viewer").classList.remove("hidden");
    let left = data.expires_in || 60; $("v-count").textContent = `se ferme dans ${left} s`;
    clearInterval(tick); tick = setInterval(() => { left--; $("v-count").textContent = `se ferme dans ${left} s`; if (left <= 0) closeViewer(); }, 1000);
  }
  function closeViewer() { clearInterval(tick); $("v-img").removeAttribute("src"); $("viewer").classList.add("hidden"); }
  $("v-close").addEventListener("click", closeViewer);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeViewer(); });

  // ---------- Commerçants (recherche + révocation) ----------
  async function merchants(query = "") {
    const main = $("main");
    const input = el("input", { type: "search", id: "m-query", placeholder: "Nom, email ou SIRET", value: query });
    const list = el("div", { id: "m-list" }, el("p", { class: "empty", text: "Chargement…" }));
    main.replaceChildren(el("form", { class: "search", onsubmit: (e) => { e.preventDefault(); merchants(input.value); } }, input, el("button", { class: "btn", type: "submit", text: "Chercher" })), list);
    const { data, error } = await sb.rpc("admin_list_merchants", { p_query: query || null });
    if (error) { list.replaceChildren(el("p", { class: "empty", text: fr(error) })); return; }
    if (!data.length) { list.replaceChildren(el("p", { class: "empty", text: "Aucun commerçant." })); return; }
    list.replaceChildren(...data.map((m) => {
      const lv = LEVEL[m.verification] || [m.verification, ""], err = el("p", { class: "err" });
      const canRevoke = ["company_verified", "profile_confirmed"].includes(m.verification);
      const reason = el("input", { type: "text", class: "hidden", placeholder: "Motif de la révocation (obligatoire)", "data-reason": true });
      const go = el("button", { class: "btn red hidden", type: "button", "data-act": "revoke-confirm", text: "Confirmer la révocation", onclick: async () => {
        err.textContent = ""; if (reason.value.trim().length < 5) { err.textContent = ERR.reason_required; return; }
        if (!confirm(`Retirer le badge de « ${m.business_name} » ? Son SIRET sera libéré.`)) return;
        const { error } = await sb.rpc("admin_revoke", { p_merchant_id: m.id, p_reason: reason.value }); if (error) { err.textContent = fr(error); return; } merchants(input.value);
      } });
      return el("div", { class: "card", "data-merchant": m.id },
        el("div", { class: "top" }, el("div", {}, el("h2", { text: m.business_name }), el("p", { class: "meta", text: `${m.owner_email}${m.siret ? " · SIRET " + m.siret : ""}` })), el("span", { class: "pill " + lv[1], text: lv[0] })),
        canRevoke ? el("div", { class: "actions" }, el("button", { class: "btn light", type: "button", "data-act": "revoke", text: "Révoquer le badge", onclick: () => { reason.classList.remove("hidden"); go.classList.remove("hidden"); reason.focus(); } })) : null,
        reason, go, err);
    }));
  }

  boot();
</script>
</body>
</html>
