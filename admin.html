    sel.value = filter;
    const list = el("div", { id: "m-list" }, el("p", { class: "empty", text: "Chargement…" }));
    main.replaceChildren(el("form", { class: "search", onsubmit: (e) => { e.preventDefault(); merchants(input.value, sel.value); } }, input, sel, el("button", { class: "btn", type: "submit", text: "Chercher" })), list);
    const { data: all, error } = await sb.rpc("admin_list_merchants", { p_query: query || null });
    if (error) { list.replaceChildren(el("p", { class: "empty", text: fr(error) })); return; }
    const data = all.filter((m) => filter === "all" || (filter === "badge" ? m.badge_reached : filter === "near" ? m.verification === "verified" && !m.badge_reached : m.verification === filter));
    if (!data.length) { list.replaceChildren(el("p", { class: "empty", text: "Aucun commerçant." })); return; }
    list.replaceChildren(...data.map((m) => {
      const lv = LEVEL[m.verification] || [m.verification, ""], err = el("p", { class: "err" });
      const canRevoke = m.verification === "verified";
      const pct = Math.min(100, Math.round(m.follower_count / m.badge_threshold * 100));
      const reason = el("input", { type: "text", class: "hidden", placeholder: "Motif de la révocation (obligatoire)", "data-reason": true });
      const go = el("button", { class: "btn red hidden", type: "button", "data-act": "revoke-confirm", text: "Confirmer la révocation", onclick: async () => {
        err.textContent = ""; if (reason.value.trim().length < 5) { err.textContent = ERR.reason_required; return; }
        if (!confirm(`Retirer la vérification de « ${m.business_name} » ? Son compte redeviendra invisible et son SIRET sera libéré.`)) return;
        const { error } = await sb.rpc("admin_revoke", { p_merchant_id: m.id, p_reason: reason.value }); if (error) { err.textContent = fr(error); return; } merchants(input.value, sel.value);
      } });
      return el("div", { class: "card", "data-merchant": m.id },
        el("div", { class: "top" }, el("div", {}, el("h2", { text: m.business_name }), el("p", { class: "meta", text: `${m.kind === "mobile" ? "Indépendant" : "Commerce"} · ${m.owner_email}${m.siret ? " · SIRET " + m.siret : ""}` })),
          el("div", { class: "pills" }, el("span", { class: "pill " + lv[1], "data-status": m.verification, text: lv[0] }), " ",
            m.badge_reached ? el("span", { class: "pill blue", "data-badge": "yes", text: "✔ Badge atteint" }) : el("span", { class: "pill", "data-badge": "no", text: "Badge : non" }))),
        el("p", { class: "meta", text: m.verification === "verified" ? "Visible partout et peut publier." : m.verification === "pending" ? "Invisible, ne peut rien publier : demande en cours d'examen." : "Invisible, ne peut rien publier : pas vérifié." }),
        el("div", { class: "prog", "aria-label": "Progression vers le badge" }, el("i", { style: `width:${pct}%` })),
        el("p", { class: "meta", text: `${m.follower_count.toLocaleString("fr-FR")} / ${m.badge_threshold.toLocaleString("fr-FR")} abonnés` + (m.badge_reached && m.verification !== "verified" ? " · seuil atteint mais NON vérifié : le compte reste invisible" : "") }),
        canRevoke ? el("div", { class: "actions" }, el("button", { class: "btn light", type: "button", "data-act": "revoke", text: "Retirer la vérification", onclick: () => { reason.classList.remove("hidden"); go.classList.remove("hidden"); reason.focus(); } })) : null,
        reason, go, err);
    }));
  }

  // ---------- Signalements (commerces, avis, application) ----------
  const KIND = { merchant: "Page de commerce", review: "Avis", user: "Profil utilisateur", app: "Application" };
  const REASON = { fake_account: "Faux compte", false_info: "Informations fausses", scam: "Arnaque", inappropriate: "Contenu inapproprié", other: "Autre", bug: "Bug" };
  const RSTATUS = { open: ["À traiter", "warn"], resolved: ["Traité", "ok"], dismissed: ["Sans suite", ""] };
  async function reports(filter) {
    const main = $("main"); main.replaceChildren(el("p", { class: "empty", text: "Chargement…" }));
    const { data, error } = await sb.rpc("admin_list_reports", { p_status: filter });
    if (error) { main.replaceChildren(el("p", { class: "empty", text: fr(error) })); return; }
    const bar = el("div", { class: "actions", style: "margin:0 0 .8rem" },
      el("button", { class: "btn " + (filter === "open" ? "" : "light"), id: "rp-open", type: "button", text: "À traiter", onclick: () => reports("open") }),
      el("button", { class: "btn " + (filter === "all" ? "" : "light"), id: "rp-all", type: "button", text: "Historique", onclick: () => reports("all") }));
    main.replaceChildren(bar, ...(data.length ? data.map(reportCard) : [el("p", { class: "empty", text: filter === "open" ? "Aucun signalement à traiter. 🎉" : "Aucun signalement." })]));
  }
  // Dans l'historique : supprimer définitivement un avis (même masqué)
  function delReviewBox(r, err, done) {
    return el("div", { class: "actions" }, el("button", { class: "btn red", type: "button", "data-act": "delete-review", text: "Supprimer l'avis (définitif)", onclick: async () => {
      const why = prompt("Raison de la suppression (obligatoire, gardée dans l'historique) :"); if (!why) return;
      if (!confirm("Supprimer DÉFINITIVEMENT cet avis ? Cette action est irréversible.")) return;
      const x = await sb.rpc("admin_delete_review", { p_review: r.review.id, p_note: why }); if (x.error) { err.textContent = fr(x.error); return; } done();
    } }));
  }
  function reportCard(r) {
    const st = RSTATUS[r.status] || [r.status, ""], err = el("p", { class: "err" }), open = r.status === "open";
    const target = r.kind === "app" ? "Problème dans l'application" : r.kind === "user" ? (r.reported_user && r.reported_user.exists ? `Profil de ${r.reported_user.pseudo} (${r.reported_user.email || "email inconnu"})` : "Profil supprimé") : (r.merchant_id ? null : "Élément supprimé");
    const c = el("div", { class: "card", "data-report": r.id },
      el("div", { class: "top" }, el("div", {}, el("h2", { text: `n° ${r.ref} · ${KIND[r.kind] || r.kind}` }),
        el("p", { class: "meta", text: `Motif : ${REASON[r.reason] || r.reason} · signalé par ${r.reporter_email || "compte supprimé"}` })),
        el("div", {}, el("span", { class: "pill " + st[1], text: st[0] }), " ", el("span", { class: "meta", text: fmt(r.created_at) }))),
      el("div", { class: "box" },
        target ? el("div", { text: target }) : el("div", {}, "Page : ", el("a", { href: "commerce.html?id=" + encodeURIComponent(r.merchant_id), target: "_blank", rel: "noopener noreferrer", "data-open-page": true, text: r.merchant_name || r.target_label || "Voir la page" }),
          r.merchant_verification ? el("span", { class: "meta", text: " · " + (LEVEL[r.merchant_verification] || [""])[0] }) : null),
        r.details ? el("div", {}, "Détails : ", el("span", { class: "rp-details", text: r.details })) : null,
        r.page ? el("div", { class: "meta", text: "Page de l'application : " + r.page }) : null,
        r.reports_on_same_target ? el("div", { class: "meta", text: `${r.reports_on_same_target} autre(s) signalement(s) sur le même élément` }) : null));
    if (r.review) c.append(el("div", { class: "box contest" }, el("b", { text: `Avis de ${r.review.pseudo || "?"} (${r.review.rating}/5)${r.review.status === "hidden" ? " — MASQUÉ" : ""} : ` }), el("span", { class: "rv-body", text: r.review.body })));
    if (!open) {
      c.append(el("div", { class: "box" }, `Traité le ${fmt(r.handled_at)} : `, r.handled_note || ""));
      if (r.review && r.review.status === "hidden") c.append(el("div", { class: "actions" }, el("button", { class: "btn light", type: "button", "data-act": "restore", text: "Remettre l'avis en ligne", onclick: async () => {
        if (!confirm("Remettre cet avis en ligne ?")) return; const x = await sb.rpc("admin_restore_review", { p_review: r.review.id }); if (x.error) { err.textContent = fr(x.error); return; } reports("all");
      } })));
      if (r.review) c.append(delReviewBox(r, err, () => reports("all")));
      c.append(err); return c;
    }
    const note = el("textarea", { rows: 2, "data-reason": true, placeholder: "Note de traitement (obligatoire, gardée dans l'historique)" });
    const run = async (outcome, hide) => {
      err.textContent = ""; if (note.value.trim().length < 5) { err.textContent = ERR.reason_required; return; }
      if (!confirm(hide ? "Masquer cet avis et clore le signalement ?" : (outcome === "resolved" ? "Marquer comme traité ?" : "Classer sans suite ?"))) return;
      const x = await sb.rpc("admin_handle_report", { p_id: r.id, p_outcome: outcome, p_note: note.value, p_hide_review: !!hide }); if (x.error) { err.textContent = fr(x.error); return; } reports("open");
    };
    c.append(note, el("div", { class: "actions" },
      r.review ? el("button", { class: "btn red", type: "button", "data-act": "delete-review", text: "Supprimer l'avis (définitif)", onclick: async () => {
        err.textContent = ""; if (note.value.trim().length < 5) { err.textContent = ERR.reason_required; return; }
        if (!confirm("Supprimer DÉFINITIVEMENT cet avis ? Cette action est irréversible.")) return;
        const x = await sb.rpc("admin_delete_review", { p_review: r.review.id, p_note: note.value }); if (x.error) { err.textContent = fr(x.error); return; } reports("open");
      } }) : null,
      r.review && r.review.status === "published" ? el("button", { class: "btn red", type: "button", "data-act": "hide", text: "Masquer l'avis", onclick: () => run("resolved", true) }) : null,
      el("button", { class: "btn green", type: "button", "data-act": "resolve", text: "Traité", onclick: () => run("resolved", false) }),
      el("button", { class: "btn light", type: "button", "data-act": "dismiss", text: "Sans suite", onclick: () => run("dismissed", false) })), err);
    return c;
  }

  boot();
</script>
</body>
</html>
