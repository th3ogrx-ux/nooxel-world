<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Commerce — Nooxel World</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="shop.css">
  <link rel="stylesheet" href="light.css">
</head>
<body>
<main>
  <div id="app"><p class="empty">Chargement…</p></div>
  <footer><a href="confidentialite.html">Confidentialité</a> · <a href="cgu.html">Conditions</a></footer>
</main>
<dialog id="post-dialog" aria-label="Publication"></dialog>
<script src="assets/vendor/supabase.js"></script>
<script src="shop.js"></script>
<script>
  const id = new URLSearchParams(location.search).get("id") || "";
  let shop = null, before = null; const mode = "grid";

  async function boot() {
    const app = $("app");
    if (!sb || !(await currentSession())) {
      app.replaceChildren(el("div", { class: "card" }, el("h2", { text: "Connexion requise" }), el("p", { text: "Connectez-vous à votre compte Nooxel pour voir cette page." }), el("a", { href: "/", text: "Aller à la connexion" })));
      return;
    }
    const { data, error } = await sb.rpc("get_merchant_page", { p_id: id });
    if (error || !data) { app.replaceChildren(el("div", { class: "card" }, el("h2", { text: "Page introuvable" }), el("p", { text: fr(error) }))); return; }
    shop = data; document.title = shop.business_name + " — Nooxel World";
    render();
  }

  const ratingText = () => shop.review_count ? `${rateStr(shop.rating_avg)} ★ (${shop.review_count} avis)` : "Aucun avis";
  const rateNode = () => shop.review_count ? [el("b", { text: rateStr(shop.rating_avg) }), " ", el("span", { class: "gold", text: "★" }), ` (${shop.review_count} avis)`] : ["Aucun avis"];
  const paintRating = () => $("shop-rating").replaceChildren(...rateNode());

  function hoursRow(s) {
    const st = openStatus(s.opening_hours, s.timezone); if (!st) return null;
    const slots = s.opening_hours[nowIn(s.timezone || "Europe/Paris").day] || [];
    const label = slots.length ? "Ouvert aujourd'hui · " + slots.map((x) => hhmm(x[0]) + " – " + hhmm(x[1])).join(" · ") : "Fermé aujourd'hui";
    return el("li", { id: "shop-hours" }, icon("clock"), el("span", { text: label }), slots.length ? el("span", { id: "shop-open", class: st.open ? "pill-open" : "pill-closed", text: st.open ? "Ouvert maintenant" : "Fermé" }) : null);
  }
  function infoCard(s) {
    const rows = [];
    if (s.kind === "mobile") rows.push(el("li", { id: "shop-zone" }, icon("pin"), el("span", { text: s.zone_label ? `Zone d'intervention : ${s.zone_label}, rayon ${s.zone_radius_km} km` : "Indépendant" })));
    else if (s.address) rows.push(el("li", { id: "shop-address" }, icon("pin"), el("span", { text: s.address })));
    rows.push(hoursRow(s));
    if (s.website) rows.push(el("li", { id: "shop-site" }, icon("globe"), el("a", { href: s.website, target: "_blank", rel: "noopener noreferrer nofollow", text: s.website.replace(/^https:\/\//, "").replace(/\/$/, "") })));
    if (s.social_url) rows.push(el("li", { id: "shop-social-row" }, icon("link"), el("a", { id: "shop-social", href: s.social_url, target: "_blank", rel: "noopener noreferrer nofollow", text: "Réseaux sociaux" })));
    const list = rows.filter(Boolean);
    return list.length ? el("ul", { class: "info", id: "shop-info" }, ...list) : null;
  }

  function moreMenu(s) {
    const items = s.is_owner ? [
      el("a", { id: "manage-edit", href: "pro.html#page-card", text: "Modifier la page" }), el("a", { id: "manage-post", href: "pro.html#posts-card", text: "Publier" }),
      s.kind === "mobile" ? el("a", { id: "manage-plan", href: "pro.html#schedule-card", text: "Planning de passage" }) : null,
      el("a", { id: "manage-pro", href: "pro.html", text: "Espace professionnel" }), el("a", { id: "gear", href: "/?menu=1", text: "Réglages du compte" })]
      : [el("button", { type: "button", id: "report-btn", text: "⚑ Signaler cette page", onclick: () => { menu.classList.add("hidden"); openReportDialog({ kind: "merchant", merchant: s.id, title: "Signaler cette page" }); } })];
    const menu = el("div", { id: "more-menu", class: "hidden", role: "menu" }, ...items.filter(Boolean));
    return menu;
  }

  function render() {
    const app = $("app"), s = shop;
    const count = el("b", { id: "followers", text: compact(s.follower_count) }), countLabel = el("span", { text: plural(s.follower_count) });
    const err = el("p", { class: "err", id: "follow-err" });
    const fbtn = el("button", { class: "btn-main", id: "follow-btn", type: "button", "aria-pressed": String(s.is_following) });
    const paint = () => { fbtn.textContent = s.is_following ? "Abonné ✓" : "Suivre"; fbtn.classList.toggle("on", s.is_following); fbtn.setAttribute("aria-pressed", String(s.is_following)); count.textContent = compact(s.follower_count); countLabel.textContent = plural(s.follower_count); };
    fbtn.addEventListener("click", async () => {
      err.textContent = ""; fbtn.disabled = true;
      const { data, error } = await sb.rpc(s.is_following ? "unfollow_merchant" : "follow_merchant", { p_merchant: s.id });
      fbtn.disabled = false;
      if (error) { err.textContent = fr(error); return; }
      s.is_following = !s.is_following; s.follower_count = data; paint();
    });
    paint();
    const mobile = s.kind === "mobile", hasPlace = !mobile && s.lat != null;
    const menu = moreMenu(s);
    const moreBtn = el("button", { class: "round", id: "more-btn", type: "button", "aria-label": "Plus d'options", "aria-haspopup": "menu", onclick: (e) => { e.stopPropagation(); menu.classList.toggle("hidden"); } }, icon("more"));
    document.addEventListener("click", () => menu.classList.add("hidden"));
    const hero = el("div", { class: "hero", id: "shop-cover" }, s.cover_path ? el("img", { src: imgUrl(s.cover_path), alt: "" }) : null,
      el("div", { class: "bar" }, el("a", { class: "round", id: "back", href: "/", "aria-label": "Retour à la carte" }, icon("back")), moreBtn), menu);
    const idrow = el("div", { class: "idrow" }, el("span", { id: "shop-logo" }, logoBadge(s.logo_path, s.business_name, 100)),
      el("div", { class: "idinfo" }, el("h2", {}, el("span", { id: "shop-name", text: s.business_name }), s.verified ? el("span", { id: "shop-badge", title: s.badge }, verifiedMark()) : null),
        s.category ? el("p", { class: "cat", id: "shop-cat", text: catLabel(s.category) }) : null, el("p", { class: "rate", id: "shop-rating" }, ...rateNode())));
    const metrics = el("div", { class: "metrics" }, el("div", {}, count, countLabel), el("div", {}, el("b", { id: "shop-posts", text: compact(s.posts_count || 0) }), el("span", { text: "posts" })),
      el("div", { id: "shop-dist-box", class: "hidden" }, el("b", { id: "shop-dist" }), el("span", { text: "de vous" })));
    const circ = (id, href, ic, label) => el("a", { class: "circ", id, href }, el("span", { class: "disc" }, icon(ic)), el("span", { text: label }));
    const actions = el("div", { class: "actions" }, s.is_owner ? null : fbtn,
      hasPlace ? circ("shop-route", "/?commerce=" + encodeURIComponent(s.id) + "&go=1", "route", "Itinéraire") : null,
      s.contact_phone ? circ("shop-call", "tel:" + s.contact_phone, "phone", "Téléphone") : null);
    const owner = s.is_owner && !s.verified ? el("div", { class: "banner", id: "owner-banner" }, "Votre page n'est pas encore visible du public : elle le sera une fois votre commerce vérifié. ", el("a", { href: "pro.html", text: "Espace professionnel" })) : null;
    const secs = el("div", { class: "utabs", role: "group", "aria-label": "Sections de la page" },
      ...[["posts", "Posts"], ["reviews", "Avis"]].map(([k, label]) => el("button", { type: "button", id: "sec-" + k, "aria-pressed": String(k === "posts"), text: label, onclick: () => showSection(k) })));
    const postsSec = el("div", { id: "section-posts", class: "section" }, el("div", { id: "posts", class: "grid" }), el("p", { class: "empty hidden", id: "no-posts", text: "Aucun post pour le moment." }),
      el("button", { class: "btn-outline hidden", id: "more", type: "button", text: "Voir plus", onclick: () => loadPosts() }));
    const reviewsSec = el("div", { id: "section-reviews", class: "section hidden" });
    const plan = mobile ? el("div", { class: "card", id: "schedule", style: "margin:1rem 1.1rem 0" }, el("h2", { text: "Planning de passage" }), el("div", { id: "slots" })) : null;
    app.replaceChildren(...[hero, idrow, metrics, actions, err, owner, infoCard(s), plan, secs, postsSec, reviewsSec].filter(Boolean));
    before = null; loadPosts(true); if (mobile) loadSchedule();
    if (hasPlace) geoIfGranted().then((me) => { if (me) { $("shop-dist").textContent = fmtKm(distKm(me, { lat: s.lat, lng: s.lng })); $("shop-dist-box").classList.remove("hidden"); } });
  }

  // ================= Avis =================
  const RERR = {
    review_too_short: "Votre avis est trop court : écrivez au moins 20 caractères pour aider les autres utilisateurs.",
    review_only_insults: "Votre avis n'est pas publié : il ne contient que des insultes. Racontez ce qui s'est passé, de façon factuelle.",
    review_contains_link: "Les liens, adresses email et numéros de téléphone ne sont pas autorisés dans un avis.",
    review_gibberish: "Votre avis semble être un texte répété sans sens. Écrivez quelques phrases sur votre expérience.",
    reply_too_short: "Réponse trop courte (5 caractères minimum).",
    reply_only_insults: "Votre réponse ne peut pas être uniquement composée d'insultes.",
    reply_contains_link: "Les liens, adresses email et numéros de téléphone ne sont pas autorisés dans une réponse.",
    reply_gibberish: "Votre réponse semble être un texte répété sans sens.",
    invalid_rating: "Choisissez une note de 1 à 5 étoiles.",
    invalid_pseudo: "Pseudo invalide : 3 à 20 caractères, lettres sans accent, chiffres, point, tiret ou souligné.",
    reserved_pseudo: "Ce pseudo n'est pas autorisé. Choisissez-en un autre.",
    bad_pseudo: "Ce pseudo n'est pas autorisé. Choisissez-en un autre.",
    pseudo_taken: "Ce pseudo est déjà pris.",
    pseudo_change_too_soon: "Vous pourrez changer de pseudo dans 30 jours.",
    pseudo_required: "Choisissez d'abord un pseudo.",
    account_too_new: "Votre compte est trop récent pour publier un avis : réessayez dans une heure.",
    too_many_reviews: "Vous avez atteint la limite de 5 nouveaux avis par jour.",
    email_not_confirmed: "Confirmez d'abord votre adresse email.",
    own_page: "Vous ne pouvez pas noter votre propre page.",
  };
  const rfr = (e) => { const m = String(e && e.message || e || ""); const k = Object.keys(RERR).find((c) => m.includes(c)); return k ? RERR[k] : fr(e); };
  const stars = (n) => el("span", { class: "stars", role: "img", "aria-label": `${n} sur 5`, text: "★".repeat(n) + "☆".repeat(5 - n) });
  let rBefore = null, rLoaded = false, vLoaded = false;

  function showSection(k) {
    for (const x of ["posts", "videos", "reviews"]) { if (!$("sec-" + x)) continue; $("sec-" + x).setAttribute("aria-pressed", String(x === k)); $("section-" + x).classList.toggle("hidden", x !== k); }   // « videos » : onglet retiré pour l'instant, le code reste prêt
    if (k === "reviews" && !rLoaded) { rLoaded = true; initReviews(); }
    if (k === "videos" && !vLoaded) { vLoaded = true; initVideos(); }
  }

  async function initReviews() {
    const box = $("section-reviews");
    box.replaceChildren(el("div", { id: "review-form-slot" }), el("div", { id: "reviews" }), el("p", { class: "empty hidden", id: "no-reviews", text: "Aucun avis pour le moment." }),
      el("button", { class: "btn ghost hidden", id: "more-reviews", type: "button", text: "Voir plus d'avis", onclick: () => loadReviews() }));
    if (!shop.is_owner) await reviewForm();
    rBefore = null; loadReviews(true);
  }

  async function reviewForm() {
    const slot = $("review-form-slot"); const { data: cx } = await sb.rpc("my_review_context", { p_merchant: shop.id });
    if (!cx) return;
    if (!cx.can_review) {
      const why = { not_verified: "Ce commerce n'est pas encore vérifié : il ne peut pas recevoir d'avis.", email_not_confirmed: "Confirmez votre adresse email pour donner votre avis.", account_too_new: "Votre compte est trop récent : vous pourrez donner votre avis dans moins d'une heure." }[cx.reason];
      if (why) slot.replaceChildren(el("div", { class: "card", id: "review-blocked" }, el("p", { text: why }))); return;
    }
    let rating = cx.review ? cx.review.rating : 0;
    const err = el("p", { class: "err", id: "r-err" }), okm = el("p", { class: "okmsg", id: "r-ok" });
    const starBtns = [1, 2, 3, 4, 5].map((n) => el("button", { type: "button", class: "star", "data-star": n, "aria-label": `${n} étoile${n > 1 ? "s" : ""}`, "aria-pressed": String(rating === n), text: "★", onclick: () => { rating = n; paint(); } }));
    const paint = () => starBtns.forEach((b, i) => { b.classList.toggle("on", i < rating); b.setAttribute("aria-pressed", String(rating === i + 1)); });
    paint();
    const body = el("textarea", { id: "r-body", maxlength: 2000, placeholder: "Racontez votre expérience : accueil, qualité, prix…" }); body.value = cx.review ? cx.review.body : "";
    const count = el("p", { class: "hint", id: "r-count" }); const upd = () => { const n = body.value.trim().length; count.textContent = n < 20 ? `${n}/20 caractères minimum` : `${n} caractères`; }; body.addEventListener("input", upd); upd();
    const visited = el("input", { type: "checkbox", id: "r-visited" }); visited.checked = !!(cx.review && cx.review.visited);
    const pseudo = cx.pseudo ? null : el("input", { type: "text", id: "r-pseudo", maxlength: 20, placeholder: "Votre pseudo public", autocomplete: "nickname" });
    const submit = el("button", { class: "btn", id: "r-submit", type: "button", text: cx.review ? "Modifier mon avis" : "Publier mon avis" });
    submit.addEventListener("click", async () => {
      err.textContent = ""; okm.textContent = ""; submit.disabled = true;
      try {
        if (pseudo) { const p = await sb.rpc("set_pseudo", { p_pseudo: pseudo.value }); if (p.error) throw p.error; }
        const r = await sb.rpc("submit_review", { p_merchant: shop.id, p_rating: rating, p_body: body.value, p_visited: visited.checked }); if (r.error) throw r.error;
        okm.textContent = "Merci, votre avis est publié."; const g = await sb.rpc("get_merchant_page", { p_id: shop.id }); if (g.data) { shop = g.data; paintRating(); }
        rBefore = null; $("reviews").replaceChildren(); await reviewForm(); loadReviews(true);
      } catch (e) { err.textContent = rfr(e); }
      submit.disabled = false;
    });
    const del = cx.review ? el("button", { class: "btn danger small", id: "r-delete", type: "button", text: "Supprimer mon avis", onclick: async () => {
      if (!confirm("Supprimer définitivement votre avis ?")) return;
      const r = await sb.rpc("delete_my_review", { p_merchant: shop.id }); if (r.error) { err.textContent = rfr(r.error); return; }
      const g = await sb.rpc("get_merchant_page", { p_id: shop.id }); if (g.data) { shop = g.data; paintRating(); }
      rBefore = null; $("reviews").replaceChildren(); await reviewForm(); loadReviews(true);
    } }) : null;
    slot.replaceChildren(el("div", { class: "card", id: "review-form" }, el("h2", { text: cx.review ? "Votre avis" : "Donner mon avis" }),
      el("div", { class: "starrow", role: "group", "aria-label": "Note" }, ...starBtns),
      el("label", {}, "Votre avis", body), count,
      el("label", { class: "check" }, visited, el("span", { text: "J'y suis allé ou j'y ai acheté (déclaratif : nous ne le vérifions pas encore)" })),
      pseudo ? el("label", {}, "Pseudo public (affiché avec votre avis, jamais votre email ; lettres sans accent, chiffres, . _ -)", pseudo) : el("p", { class: "hint", text: "Publié sous le pseudo : " + cx.pseudo }),
      err, okm, submit, del));
  }

  async function loadReviews(first) {
    const more = $("more-reviews"); more.disabled = true;
    const { data, error } = await sb.rpc("list_reviews", { p_merchant: shop.id, p_before: rBefore, p_limit: 10 });
    more.disabled = false;
    if (error) { $("no-reviews").textContent = fr(error); $("no-reviews").classList.remove("hidden"); return; }
    const box = $("reviews"); for (const r of data) box.append(reviewCard(r));
    if (data.length) rBefore = data[data.length - 1].created_at;
    more.classList.toggle("hidden", data.length < 10);
    if (first) $("no-reviews").classList.toggle("hidden", data.length > 0);
  }

  function reviewCard(r) {
    const card = el("article", { class: "rcard", "data-review": r.id },
      el("div", { class: "top" }, silhouette(48), el("div", { class: "who" }, el("b", { class: "rv-pseudo", text: r.pseudo || "Utilisateur" }),
        el("span", { class: "stars-line" }, stars(r.rating), el("span", { class: "score", text: rateStr(r.rating) }))), el("span", { class: "date", text: dateFr(r.created_at) })),
      r.visited ? el("p", { class: "tag", style: "margin:.4rem 0 0;color:#0d6b3a;font-size:.85rem", text: "✓ A déclaré y être allé(e) (non vérifié)" }) : null,
      el("p", { class: "txt", text: r.body }));
    const replyBox = el("div", { class: "reply-slot" });
    const showReply = (rep) => {
      replyBox.replaceChildren();
      if (rep) replyBox.append(el("div", { class: "reply" }, el("b", { text: "Réponse du commerçant" }), el("p", { class: "reply-body", text: rep.body }), el("p", { class: "post-date", style: "padding:0", text: ago(rep.at) })));
      if (shop.is_owner) {
        const err = el("p", { class: "err" }); const ta = el("textarea", { maxlength: 1000, "data-reply-input": r.id, placeholder: "Votre réponse publique…" }); ta.value = rep ? rep.body : "";
        const form = el("div", { class: "hidden", "data-reply-form": r.id }, ta, err,
          el("button", { class: "btn small", type: "button", "data-reply-send": r.id, text: "Publier la réponse", onclick: async () => {
            err.textContent = ""; const x = await sb.rpc("reply_to_review", { p_review: r.id, p_text: ta.value }); if (x.error) { err.textContent = rfr(x.error); return; }
            r.reply = { body: ta.value.trim(), at: new Date().toISOString() }; showReply(r.reply);
          } }));
        replyBox.append(el("button", { class: "btn ghost small", type: "button", "data-reply-open": r.id, text: rep ? "Modifier ma réponse" : "Répondre", onclick: () => form.classList.toggle("hidden") }), form);
        if (rep) replyBox.append(el("button", { class: "btn danger small", type: "button", "data-reply-del": r.id, text: "Supprimer ma réponse", onclick: async () => { if (!confirm("Supprimer votre réponse ?")) return; await sb.rpc("delete_reply", { p_review: r.id }); r.reply = null; showReply(null); } }));
      }
    };
    showReply(r.reply); card.append(replyBox);
    if (!r.mine) card.append(el("button", { class: "linkbtn", type: "button", "data-report-review": r.id, text: "⚑ Signaler cet avis", onclick: () => openReportDialog({ kind: "review", review: r.id, title: "Signaler cet avis" }) }));
    return card;
  }


  // ================= Vidéos (format vertical, une seule vidéo chargée à la fois) =================
  let vBefore = null; const vids = [];
  const dur = (n) => `0:${String(n).padStart(2, "0")}`;
  async function initVideos() {
    $("section-videos").replaceChildren(el("div", { class: "vgrid", id: "vgrid" }), el("p", { class: "empty hidden", id: "no-videos", text: "Aucune vidéo pour le moment." }),
      el("button", { class: "btn ghost hidden", id: "more-videos", type: "button", text: "Voir plus", onclick: () => loadVideos() }));
    loadVideos(true);
  }
  async function loadVideos(first) {
    const more = $("more-videos"); more.disabled = true;
    const { data, error } = await sb.rpc("list_merchant_videos", { p_merchant: shop.id, p_before: vBefore, p_limit: 12 });
    more.disabled = false;
    if (error) { $("no-videos").textContent = fr(error); $("no-videos").classList.remove("hidden"); return []; }
    for (const v of data) { vids.push(v); $("vgrid").append(el("button", { class: "vtile", type: "button", "data-video": v.id, "aria-label": "Lire la vidéo" + (v.caption ? " : " + v.caption : ""), onclick: () => openReel(vids.indexOf(v)) },
      el("img", { src: imgUrl(v.poster_path), alt: "", loading: "lazy", decoding: "async" }), el("span", { class: "vdur", text: dur(v.duration_s) }))); }
    if (data.length) vBefore = data[data.length - 1].created_at;
    more.classList.toggle("hidden", data.length < 12);
    if (first) $("no-videos").classList.toggle("hidden", data.length > 0);
    return data;
  }

  // Lecteur plein écran : défilement vertical (un « swipe » = la vidéo suivante). Seule la vidéo à l'écran est téléchargée.
  const lowData = () => { const c = navigator.connection; return !!(c && (c.saveData || /(^|-)2g$/.test(c.effectiveType || ""))); };
  let reelMuted = true, reelIO = null;
  function openReel(start) {
    closeReel();
    const box = el("div", { id: "reel", role: "dialog", "aria-modal": "true", "aria-label": "Vidéos" });
    const scroller = el("div", { class: "reel-scroll", id: "reel-scroll" });
    const close = el("button", { class: "reel-btn", id: "reel-close", type: "button", "aria-label": "Fermer", text: "✕", onclick: closeReel });
    const mute = el("button", { class: "reel-btn", id: "reel-mute", type: "button", "aria-label": "Son", text: reelMuted ? "🔇" : "🔊", onclick: () => { reelMuted = !reelMuted; mute.textContent = reelMuted ? "🔇" : "🔊"; box.querySelectorAll("video").forEach((v) => { v.muted = reelMuted; }); } });
    const rep = el("button", { class: "reel-btn", id: "reel-report", type: "button", "aria-label": "Signaler", text: "⚑", onclick: () => { closeReel(); openReportDialog({ kind: "merchant", merchant: shop.id, title: "Signaler cette page" }); } });
    box.append(scroller, el("div", { class: "reel-top" }, close, el("span", { class: "reel-name", text: shop.business_name }), mute, shop.is_owner ? null : rep));
    document.body.append(box); document.body.classList.add("noscroll");
    const addSlides = (list) => list.forEach((v) => {
      const video = el("video", { playsinline: true, loop: true, preload: "none", poster: imgUrl(v.poster_path), "data-vid": v.id }); video.muted = reelMuted;
      const playBtn = el("button", { class: "reel-play hidden", type: "button", "aria-label": "Lire", text: "▶" });
      const slide = el("section", { class: "reel-slide", "data-slide": v.id }, video, playBtn, v.caption ? el("p", { class: "reel-cap", text: v.caption }) : null);
      const toggle = () => { if (video.paused) { video.play().catch(() => {}); playBtn.classList.add("hidden"); } else { video.pause(); playBtn.classList.remove("hidden"); } };
      video.addEventListener("click", toggle); playBtn.addEventListener("click", toggle);
      video.addEventListener("ended", () => { if (!video.loop) return; video.currentTime = 0; video.play().catch(() => {}); });   // filet de sécurité si la boucle automatique échoue
      scroller.append(slide); reelIO && reelIO.observe(slide);
    });
    reelIO = new IntersectionObserver((entries) => entries.forEach((e) => {
      const video = e.target.querySelector("video"), btn = e.target.querySelector(".reel-play");
      if (e.isIntersecting && e.intersectionRatio >= 0.7) {
        if (!video.getAttribute("src")) { video.src = videoUrl(vids.find((x) => x.id === video.dataset.vid).video_path); }   // chargement à la demande
        if (lowData()) { btn.classList.remove("hidden"); } else { btn.classList.add("hidden"); video.play().catch(() => btn.classList.remove("hidden")); }
        const i = vids.findIndex((x) => x.id === video.dataset.vid);
        if (i >= vids.length - 2 && !$("more-videos").classList.contains("hidden")) loadVideos().then((n) => n && n.length && addSlides(n));
      } else { video.pause(); }
    }), { root: scroller, threshold: [0.7] });
    addSlides(vids); document.addEventListener("keydown", reelKey);
    const target = scroller.children[start] || scroller.children[0]; if (target) target.scrollIntoView();
  }
  function reelKey(e) { if (e.key === "Escape") closeReel(); }
  function closeReel() {
    const box = $("reel"); if (!box) return;
    if (reelIO) { reelIO.disconnect(); reelIO = null; }
    box.querySelectorAll("video").forEach((v) => { v.pause(); v.removeAttribute("src"); v.load(); });
    box.remove(); document.body.classList.remove("noscroll"); document.removeEventListener("keydown", reelKey);
  }

  const plural = (n) => (n > 1 ? "abonnés" : "abonné");

  const when = (d) => new Date(d).toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  async function loadSchedule() {
    const { data } = await sb.rpc("list_schedule", { p_merchant: shop.id }); const box = $("slots");
    if (!data || !data.length) { box.replaceChildren(el("p", { text: "Aucun passage prévu pour le moment." })); return; }
    box.replaceChildren(...data.map((r) => el("div", { class: "slot", "data-slot": r.id },
      el("div", {}, el("b", { text: r.place }), r.now ? el("span", { class: "badge", style: "margin-left:.5rem", text: "En ce moment" }) : null, el("small", { text: `${when(r.starts_at)} → ${new Date(r.ends_at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}${r.note ? " · " + r.note : ""}` })))));
  }

  async function loadPosts(first) {
    const more = $("more"); more.disabled = true;
    const { data, error } = await sb.rpc("list_merchant_posts", { p_merchant: shop.id, p_before: before, p_limit: 12 });
    more.disabled = false;
    if (error) { $("no-posts").textContent = fr(error); $("no-posts").classList.remove("hidden"); return; }
    const box = $("posts");
    if (mode === "grid" && !box.classList.contains("grid")) box.classList.add("grid");
    if (mode === "list") box.classList.remove("grid");
    for (const p of data) box.append(mode === "grid" ? tile(p) : postCard(p, false));
    if (data.length) before = data[data.length - 1].created_at;
    more.classList.toggle("hidden", data.length < 12);
    if (first) $("no-posts").classList.toggle("hidden", data.length > 0);
  }

  function tile(p) {
    return el("button", { class: "tile", type: "button", "data-post": p.id, "aria-label": "Ouvrir la publication", onclick: () => {
      const dlg = $("post-dialog");
      dlg.replaceChildren(el("button", { class: "btn ghost close", type: "button", text: "Fermer", onclick: () => dlg.close() }), postCard(p, false));
      dlg.showModal();
    } }, p.image_path ? el("img", { src: imgUrl(p.image_path), alt: "", loading: "lazy", decoding: "async" }) : el("span", { text: p.body }));
  }
  $("post-dialog").addEventListener("click", (e) => { if (e.target === $("post-dialog")) $("post-dialog").close(); });
  boot();
</script>
</body>
