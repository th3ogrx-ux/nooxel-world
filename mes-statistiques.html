  <style>
    body { background: radial-gradient(130% 55% at 50% 0%, #11307a 0%, #071433 45%, #030816 100%) no-repeat #030816; background-attachment: fixed; }
    .hidden { display: none !important; }
    svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .seg { display: flex; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(140,170,255,.18); margin: .2rem 0 1rem; backdrop-filter: blur(6px); }
    .seg button { flex: 1; border: 0; background: none; color: #b6c6ea; padding: .55rem .4rem; border-radius: 999px; font: inherit; font-size: .92rem; font-weight: 600; cursor: pointer; transition: background .2s, color .2s; }
    .seg button.on { background: linear-gradient(180deg, #4b95ff, #2169ea); color: #fff; box-shadow: 0 4px 14px rgba(47,123,255,.45); }
    .glass { position: relative; border-radius: 24px; border: 1px solid rgba(140,170,255,.18); background: linear-gradient(165deg, rgba(40,80,190,.30), rgba(10,22,56,.78)); box-shadow: 0 14px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06); }
    .hero { padding: 1.15rem 1.1rem .9rem; margin-bottom: 1rem; overflow: hidden; }
    .hero::before { content: ""; position: absolute; right: -60px; top: -70px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(90,155,255,.35), transparent 70%); pointer-events: none; }
    .hero > small { color: #9db4e8; font-size: .82rem; letter-spacing: .06em; text-transform: uppercase; }
    .hero .bignum { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; margin: .15rem 0 .1rem; }
    .hero .bignum b { font-size: 3rem; line-height: 1.05; letter-spacing: -.03em; }
    .delta { display: inline-flex; align-items: center; gap: .2rem; padding: .12rem .55rem; border-radius: 999px; font-size: .78rem; font-weight: 700; background: rgba(255,255,255,.08); color: #b6c6ea; }
    .delta.up { background: rgba(52,211,153,.16); color: #4be0a8; } .delta.down { background: rgba(255,107,107,.16); color: #ff8686; }
    .chips { display: flex; gap: .45rem; overflow-x: auto; margin: .8rem -.2rem .3rem; padding: 0 .2rem .2rem; scrollbar-width: none; } .chips::-webkit-scrollbar { display: none; }
    .chips button { flex: none; border: 1px solid rgba(140,170,255,.25); background: rgba(255,255,255,.04); color: #b6c6ea; padding: .4rem .85rem; border-radius: 999px; font: inherit; font-size: .85rem; cursor: pointer; }
    .chips button.on { background: rgba(75,149,255,.22); border-color: #4b95ff; color: #fff; }
    .chart { position: relative; height: 220px; } .chart svg { display: block; overflow: visible; max-width: 100%; }
    .chart .tip { position: absolute; pointer-events: none; min-width: 120px; padding: .45rem .65rem; border-radius: 10px; background: #0d2150; border: 1px solid rgba(120,160,255,.35); font-size: .8rem; box-shadow: 0 8px 20px rgba(0,0,0,.4); transform: translate(-50%, -110%); z-index: 3; color: #e8efff; }
    .chart .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: .35rem; } .chart .tip b { display: block; }
    .legend { display: flex; gap: 1rem; color: #8ea3d0; font-size: .8rem; margin-top: .3rem; } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: .35rem; }
    h2.sec2 { margin: 1.5rem .2rem .7rem; font-size: 1.08rem; letter-spacing: .01em; }
    .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .kpi { padding: .85rem .9rem .6rem; overflow: hidden; }
    .kpi .top { display: flex; align-items: center; gap: .5rem; }
    .kpi .ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #fff; flex: none; }
    .kpi small { color: #a9bce6; font-size: .78rem; line-height: 1.2; }
    .kpi b { display: block; font-size: 1.85rem; line-height: 1.15; margin-top: .45rem; letter-spacing: -.02em; }
    .kpi .row { display: flex; align-items: center; justify-content: space-between; gap: .3rem; margin-top: .1rem; min-height: 1.5rem; }
    .kpi .hint { color: #8ea3d0; font-size: .74rem; line-height: 1.3; margin-top: .15rem; min-height: 1.9em; }
    .kpi .spark { height: 38px; margin: .2rem -.9rem 0; }
    .panel { padding: 1rem 1rem .9rem; margin-bottom: .9rem; }
    .panel h3 { margin: 0; font-size: 1.02rem; } .panel .sub { margin: .15rem 0 .7rem; color: #8ea3d0; font-size: .82rem; line-height: 1.35; }
    .twocol { display: flex; align-items: center; gap: 1rem; } .twocol .legendv { display: grid; gap: .5rem; flex: 1; min-width: 0; font-size: .9rem; }
    .legendv div { display: flex; align-items: center; gap: .5rem; } .legendv i { width: 11px; height: 11px; border-radius: 4px; flex: none; } .legendv b { margin-left: auto; }
    .funnel { display: grid; gap: .6rem; }
    .fstep { position: relative; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,.05); }
    .fstep i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, rgba(75,149,255,.55), rgba(75,149,255,.18)); border-radius: 14px; }
    .fstep div { position: relative; display: flex; justify-content: space-between; align-items: center; padding: .65rem .85rem; gap: .6rem; font-size: .92rem; } .fstep b { font-size: 1.1rem; }
    .fconv { text-align: center; color: #8ea3d0; font-size: .78rem; margin: -.15rem 0; }
    .rating { display: flex; align-items: center; gap: 1rem; } .rating .score { font-size: 2.6rem; font-weight: 700; line-height: 1; } .rating .stars { color: #f5b301; letter-spacing: .08em; font-size: 1.15rem; } .rating small { color: #8ea3d0; display: block; margin-top: .2rem; }
    .items { list-style: none; margin: 0; padding: 0; }
    .items li { display: flex; align-items: center; gap: .8rem; padding: .65rem 0; border-top: 1px solid rgba(140,170,255,.12); } .items li:first-child { border-top: 0; }
    .items img, .items .ph { width: 54px; height: 54px; border-radius: 14px; object-fit: cover; background: #14285a; flex: none; display: grid; place-items: center; color: #cfe0ff; font-size: 1.1rem; }
    .items .txt { flex: 1; min-width: 0; } .items .txt b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: .95rem; }
    .items .bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.08); margin: .35rem 0 .15rem; overflow: hidden; } .items .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #2f7bff, #6bb0ff); }
    .items .txt small { color: #8ea3d0; font-size: .76rem; }
    .items .val { text-align: right; white-space: nowrap; font-weight: 700; color: #7fb4ff; font-size: .95rem; } .items .val small { display: block; color: #8ea3d0; font-weight: 400; font-size: .76rem; }
    .note { color: #7f93bf; font-size: .78rem; margin: .5rem .2rem 0; line-height: 1.4; }
  </style>

<body>
<div class="shell"><main class="acc">
  <header class="hd"><a data-back href="parametres.html" id="back" aria-label="Retour"></a><h1>Mes statistiques</h1><span></span></header>
  <div id="app"><p class="msg" style="color:#8ea3d0">Chargement…</p></div>
</main></div>
<script src="assets/vendor/supabase.js"></script>
<script src="shop.js"></script>
<script src="mfa.js"></script>
<script src="charts.js"></script>
<script src="tabbar.js" data-active="account"></script>
<script>
  $("back").append(icon("back", 26));
  ICONS.play = '<polygon points="7 4.5 19 12 7 19.5"/>'; ICONS.ppl = '<circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/>';
  let D = null, gran = "day", mainKey = "profile";
  const WINDOW = { day: "30 derniers jours", week: "12 dernières semaines", month: "12 derniers mois" };
  const COL = { profile: "#a78bfa", views: "#4f9bff", followers: "#fbbf24", search: "#22d3ee", map: "#34d399", message: "#f472b6", route: "#fb923c", reviews: "#facc15", engagement: "#ff7a9c", videos: "#4f9bff", photos: "#34d399" };
  const val = (i, key) => Number(D.series[i][key] || 0);
  const rng = (from, to, key) => { let s = 0; for (let i = from; i <= to; i++) s += val(i, key); return s; };
  const metricOf = (key, i) => key === "views" ? val(i, "video_view") + val(i, "photo_view") : key === "search" ? val(i, "search_impression") : key === "map" ? val(i, "map_impression") : key === "profile" ? val(i, "profile_view")
    : key === "followers" ? val(i, "new_followers") : key === "message" ? val(i, "message_click") : key === "route" ? val(i, "route_click") : key === "reviews" ? val(i, "reviews") : 0;
  const sumMetric = (key, from, to) => { let s = 0; for (let i = from; i <= to; i++) s += metricOf(key, i); return s; };
  const perBucket = (key, bs) => bs.map((b) => sumMetric(key, b.from, b.to));
  const pct = (n) => (Math.round(n * 10) / 10).toLocaleString("fr-FR") + " %";

  // Période précédente de même longueur (pas disponible pour « 12 mois » : l'historique tient sur 365 jours)
  function windowOf(bs) { return { from: bs[0].from, to: bs[bs.length - 1].to }; }
  function prevOf(w) { const len = w.to - w.from + 1, from = w.from - len; return from >= 0 ? { from, to: w.from - 1 } : null; }
  function deltaNode(cur, prev) {
    if (prev == null) return el("span", { class: "delta", text: "—" });
    if (prev === 0 && cur === 0) return el("span", { class: "delta", text: "stable" });
    if (prev === 0) return el("span", { class: "delta up", text: "▲ nouveau" });
    const d = (cur - prev) / prev * 100; if (Math.abs(d) < 0.5) return el("span", { class: "delta", text: "= stable" });
    return el("span", { class: "delta " + (d > 0 ? "up" : "down"), text: (d > 0 ? "▲ +" : "▼ ") + Math.round(d).toLocaleString("fr-FR") + " %" });
  }
  const thumb = (path, fb) => path ? el("img", { src: imgUrl(path), alt: "", loading: "lazy" }) : el("span", { class: "ph", text: fb });

  const KPIS = [
    ["profile", "Visites de votre page", "ppl", "Personnes qui ont ouvert votre page"],
    ["followers", "Nouveaux abonnés", "heart", ""],
    ["views", "Vues vidéos et photos", "play", ""],
    ["search", "Apparitions en recherche", "search", "Fois où vous êtes sorti dans une recherche"],
    ["map", "Apparitions sur la carte", "pin2", "Fois où votre pin s'est affiché"],
    ["message", "Clics sur « Message »", "mail", ""],
    ["route", "Clics sur « Itinéraire »", "route", "Personnes qui veulent venir chez vous"],
    ["reviews", "Avis reçus", "star", ""],
  ];

  function paint() {
    const bs = nxBuckets(D.series, gran), w = windowOf(bs), pw = gran === "month" ? null : prevOf(w), labels = bs.map((b) => b.label);
    const cur = (k) => sumMetric(k, w.from, w.to), prv = (k) => pw ? sumMetric(k, pw.from, pw.to) : null;
    const v = rng(w.from, w.to, "video_view"), ph = rng(w.from, w.to, "photo_view"), views = v + ph, likes = rng(w.from, w.to, "likes"), shares = rng(w.from, w.to, "share_click");
    // héros
    const heroKeys = { profile: ["Visites de votre page", "profile"], views: ["Vues de vos vidéos et photos", "views"], followers: ["Nouveaux abonnés", "followers"], reach: ["Apparitions (recherche + carte)", "reach"] };
    const total = mainKey === "reach" ? cur("search") + cur("map") : cur(mainKey), before = mainKey === "reach" ? (pw ? prv("search") + prv("map") : null) : prv(mainKey);
    $("hero-label").textContent = heroKeys[mainKey][0] + " · " + WINDOW[gran]; $("hero-num").textContent = nxNum(total);
    $("hero-delta").replaceChildren(deltaNode(total, before), ...(pw ? [el("small", { text: "par rapport à la période précédente" })] : []));
    document.querySelectorAll("#chips button").forEach((b) => b.classList.toggle("on", b.dataset.k === mainKey));
    const series = mainKey === "views" ? [{ name: "Vidéos", color: COL.videos, values: bs.map((b) => rng(b.from, b.to, "video_view")) }, { name: "Photos", color: COL.photos, values: bs.map((b) => rng(b.from, b.to, "photo_view")) }]
      : mainKey === "reach" ? [{ name: "Recherche", color: COL.search, values: perBucket("search", bs) }, { name: "Carte", color: COL.map, values: perBucket("map", bs) }]
      : [{ name: heroKeys[mainKey][0], color: COL[mainKey], values: perBucket(mainKey, bs) }];
    nxLine($("hero-chart"), labels, series, { label: heroKeys[mainKey][0] });
    $("hero-legend").replaceChildren(...(series.length > 1 ? series.map((x) => el("span", {}, el("i", { style: "background:" + x.color }), x.name)) : []));
    // cartes
    for (const [k] of KPIS) {
      const c = cur(k), card = $("kpi-" + k);
      card.querySelector("b").textContent = nxNum(c); card.querySelector(".row").replaceChildren(deltaNode(c, prv(k)));
      if (k === "followers") card.querySelector(".hint").textContent = `${nxNum(D.merchant.follower_count)} abonné(s) au total`;
      if (k === "views") card.querySelector(".hint").textContent = `${nxNum(v)} vidéo(s) · ${nxNum(ph)} photo(s)`;
      if (k === "reviews") { const r = rng(w.from, w.to, "rating_sum"); card.querySelector(".hint").textContent = c ? `Note moyenne : ${(Math.round(r / c * 10) / 10).toLocaleString("fr-FR")} ★` : "Aucun avis sur la période"; }
      nxSpark(card.querySelector(".spark"), perBucket(k, bs), COL[k]);
    }
    // répartition des vues
    nxRing($("ring-views"), [{ value: v, color: COL.videos }, { value: ph, color: COL.photos }], nxNum(views), "vues", 140);
    $("lv-videos").textContent = nxNum(v); $("lv-photos").textContent = nxNum(ph);
    // engagement
    const eng = views > 0 ? Math.min(100, (likes + shares) / views * 100) : null;
    nxRing($("ring-eng"), eng == null ? [] : [{ value: eng, color: COL.engagement }, { value: 100 - eng, color: "rgba(140,170,255,.0)" }], eng == null ? "—" : pct(eng), "engagement", 140);
    $("eng-text").textContent = eng == null ? "Pas encore de vues sur la période : le taux apparaîtra dès les premières vues." : `Sur 100 vues, environ ${Math.round(eng)} personne(s) aiment ou partagent (${nxNum(likes)} ♥ et ${nxNum(shares)} partage(s) pour ${nxNum(views)} vue(s)).`;
    // parcours
    const appear = cur("search") + cur("map"), visits = cur("profile"), actions = cur("message") + cur("route"), top = Math.max(appear, visits, actions, 1);
    const steps = [["fs-appear", appear], ["fs-visit", visits], ["fs-act", actions]];
    for (const [id, n] of steps) { const e = $(id); e.querySelector("b").textContent = nxNum(n); e.querySelector("i").style.width = Math.max(n ? 6 : 0, n / top * 100) + "%"; }
    $("fc-1").textContent = appear ? `${Math.min(100, Math.round(visits / appear * 100))} % des apparitions donnent une visite` : "";
    $("fc-2").textContent = visits ? `${Math.min(100, Math.round(actions / visits * 100))} % des visites donnent un contact (Message ou Itinéraire)` : "";
    // avis
    const rc = cur("reviews"), rs = rng(w.from, w.to, "rating_sum"), avg = rc ? rs / rc : D.merchant.rating_avg;
    $("rating-score").textContent = avg ? Number(avg).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) : "—";
    $("rating-stars").textContent = avg ? "★".repeat(Math.round(avg)) + "☆".repeat(5 - Math.round(avg)) : "☆☆☆☆☆";
    $("rating-sub").textContent = rc ? `${nxNum(rc)} avis sur la période · ${nxNum(D.merchant.review_count)} au total` : `Aucun avis sur la période · ${nxNum(D.merchant.review_count)} au total`;
  }

  function render() {
    const app = $("app");
    const seg = el("div", { class: "seg", role: "group", "aria-label": "Période" }, ...[["day", "Jours"], ["week", "Semaines"], ["month", "Mois"]].map(([k, l]) =>
      el("button", { type: "button", "data-gran": k, class: k === gran ? "on" : "", text: l, onclick: () => { gran = k; seg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.gran === k)); paint(); } })));
    const hero = el("div", { class: "glass hero", id: "hero" }, el("small", { id: "hero-label" }),
      el("div", { class: "bignum" }, el("b", { id: "hero-num", text: "0" }), el("span", { id: "hero-delta" })),
      el("div", { class: "chips", id: "chips" }, ...[["profile", "Visites"], ["views", "Vues"], ["followers", "Abonnés"], ["reach", "Apparitions"]].map(([k, l]) => el("button", { type: "button", "data-k": k, text: l, onclick: () => { mainKey = k; paint(); } }))),
      el("div", { class: "chart", id: "hero-chart" }), el("div", { class: "legend", id: "hero-legend" }));
    const kpis = el("div", { class: "kpis" }, ...KPIS.map(([k, label, ic, hint]) => el("div", { class: "glass kpi", id: "kpi-" + k },
      el("div", { class: "top" }, el("span", { class: "ico", style: `background:${COL[k]}33;color:${COL[k]}` }, icon(ic)), el("small", { text: label })),
      el("b", { text: "0" }), el("div", { class: "row" }), el("div", { class: "hint", text: hint }), el("div", { class: "spark" }))));
    const ringBox = (id) => el("div", { id, style: "flex:none;width:140px;height:140px" });
    const viewsPanel = el("div", { class: "glass panel", id: "views-panel" }, el("h3", { text: "Qu'est-ce qui est regardé ?" }), el("p", { class: "sub", text: "Répartition des vues entre vos vidéos et vos photos" }),
      el("div", { class: "twocol" }, ringBox("ring-views"), el("div", { class: "legendv" },
        el("div", {}, el("i", { style: "background:" + COL.videos }), "Vidéos", el("b", { id: "lv-videos" })), el("div", {}, el("i", { style: "background:" + COL.photos }), "Photos", el("b", { id: "lv-photos" })))));
    const engPanel = el("div", { class: "glass panel", id: "eng-panel" }, el("h3", { text: "Taux d'engagement" }), el("p", { class: "sub", text: "Part des vues qui donnent un ♥ ou un partage" }),
      el("div", { class: "twocol" }, ringBox("ring-eng"), el("p", { id: "eng-text", style: "margin:0;font-size:.9rem;line-height:1.45;color:#c3d0ee" })));
    const step = (id, label) => el("div", { class: "fstep", id }, el("i"), el("div", {}, el("span", { text: label }), el("b", { text: "0" })));
    const funnel = el("div", { class: "glass panel", id: "funnel" }, el("h3", { text: "Le parcours de vos clients" }), el("p", { class: "sub", text: "Du moment où ils vous voient jusqu'au moment où ils vous contactent" }),
      el("div", { class: "funnel" }, step("fs-appear", "1 · Ils vous voient (recherche + carte)"), el("div", { class: "fconv", id: "fc-1" }), step("fs-visit", "2 · Ils ouvrent votre page"), el("div", { class: "fconv", id: "fc-2" }), step("fs-act", "3 · Ils vous contactent (Message + Itinéraire)")));
    const ratingPanel = el("div", { class: "glass panel", id: "rating-panel" }, el("h3", { text: "Vos avis" }), el("p", { class: "sub", text: "Ce que pensent vos clients" }),
      el("div", { class: "rating" }, el("div", { class: "score", id: "rating-score" }), el("div", {}, el("div", { class: "stars", id: "rating-stars" }), el("small", { id: "rating-sub" }))));
    const list = (arr, empty, key, fb, row) => { const max = Math.max(1, ...arr.map((x) => x.views)); return el("ul", { class: "items" }, ...(arr.length ? arr.slice(0, 10).map((x) => row(x, max)) : [el("li", {}, el("span", { class: "note", text: empty }))])); };
    const date = (d) => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
    const detail = (id, title, arr, empty, fb, attr, titleOf, thumbOf) => el("div", { class: "glass panel", id }, el("h3", { text: title }), el("p", { class: "sub", text: "Vues depuis le début des mesures" }),
      list(arr, empty, "", fb, (x, max) => el("li", { [attr]: x.id }, thumb(thumbOf(x), fb), el("div", { class: "txt" }, el("b", { text: titleOf(x) }), el("div", { class: "bar" }, el("i", { style: `width:${Math.max(x.views ? 5 : 0, x.views / max * 100)}%` })), el("small", { text: date(x.created_at) })),
        el("div", { class: "val" }, nxNum(x.views) + " vue(s)", el("small", { text: "♥ " + nxNum(x.like_count) })))));
    const since = D.tracking_since ? `Les mesures ont démarré le ${new Date(D.tracking_since + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })} : avant, rien n'était compté.` : "Les mesures viennent de démarrer : les premiers chiffres apparaîtront dès les prochaines visites.";
    app.replaceChildren(seg, hero, el("h2", { class: "sec2", text: "Vos chiffres clés" }), kpis,
      el("h2", { class: "sec2", text: "Comprendre votre audience" }), viewsPanel, funnel, engPanel, ratingPanel,
      el("h2", { class: "sec2", text: "Détail par contenu" }),
      detail("video-detail", "Vos vidéos", D.videos, "Vous n'avez pas encore publié de vidéo.", "▶", "data-video", (x) => x.caption || "Vidéo sans légende", (x) => x.poster_path),
      detail("photo-detail", "Vos photos", D.photos, "Vous n'avez pas encore publié de photo.", "📷", "data-photo", (x) => x.body || "Photo sans texte", (x) => x.image_path),
      el("p", { class: "note", text: since }),
      el("p", { class: "note", text: "Une même personne est comptée une seule fois par jour. Taux d'engagement = (♥ + partages) ÷ vues des vidéos et photos ; les commentaires ne sont pas encore disponibles." }));
    paint();
  }

  (async function boot() {
    if (!sb || !(await currentSession())) { $("app").replaceChildren(el("p", { class: "msg" }, "Connectez-vous pour voir vos statistiques. ", el("a", { href: "/", text: "Se connecter" }))); return; }
    if (await gateProfile()) return;
    const { data, error } = await sb.rpc("my_stats");
    if (error) { $("app").replaceChildren(el("p", { class: "msg", text: /not_verified|not_found/.test(error.message || "") ? "Les statistiques sont disponibles dès que votre commerce est vérifié." : "Statistiques indisponibles pour le moment. Réessayez dans un instant." })); return; }
    D = data; render();
  })();
  addEventListener("resize", () => { if (D && $("hero-chart")) paint(); });
</script>
<script src="back.js"></script>
</body>
</html>
