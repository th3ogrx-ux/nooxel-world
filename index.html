<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nooxel World</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #0b0b0f; color: #fff; font-family: system-ui, sans-serif; display: grid; place-items: start center; padding: 2rem 1rem; }
    main { width: 100%; max-width: 420px; }
    input, button { font: inherit; padding: .6rem .8rem; border-radius: 8px; border: 1px solid #333; background: #16161d; color: #fff; }
    button { cursor: pointer; background: #3b82f6; border-color: #3b82f6; }
    button.ghost { background: transparent; border-color: #333; }
    form { display: flex; gap: .5rem; margin: 1rem 0; flex-wrap: wrap; }
    form input { flex: 1; min-width: 0; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; padding: .6rem 0; border-bottom: 1px solid #222; }
    .muted { color: #8a8a99; font-size: .9rem; }
    .hidden { display: none; }

    #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #04122e 0%, #000 70%); transition: opacity .6s ease, visibility .6s ease; }
    #splash.done { opacity: 0; visibility: hidden; }
    .splash-inner { display: grid; justify-items: center; gap: 1.6rem; }
    .splash-logo { width: min(55vw, 260px); border-radius: 22%; animation: float 3s ease-in-out infinite, glow 2.4s ease-in-out infinite; }
    .splash-name { font-size: 1.4rem; letter-spacing: .5em; text-transform: uppercase; color: #cfe3ff; margin: 0; padding-left: .5em; }
    .splash-bar { width: 180px; height: 3px; border-radius: 3px; background: #0a1c3f; overflow: hidden; }
    .splash-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #0a5cff, #19d3ff); animation: load 1.2s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-10px); } }
    @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 18px rgba(25,120,255,.45)); } 50% { filter: drop-shadow(0 0 40px rgba(25,211,255,.8)); } }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    @media (prefers-reduced-motion: reduce) { .splash-logo, .splash-bar::after { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Chargement">
    <div class="splash-inner">
      <img class="splash-logo" src="assets/logo.png" alt="Nooxel World">
      <p class="splash-name">Nooxel</p>
      <div class="splash-bar"></div>
    </div>
  </div>
  <main>
    <h1>Nooxel World</h1>
    <p id="msg" class="muted"></p>

    <form id="auth">
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Mot de passe (6+ car.)" required minlength="6">
      <button type="submit" id="login">Connexion</button>
      <button type="button" id="signup" class="ghost">Créer un compte</button>
    </form>

    <section id="app" class="hidden">
      <p class="muted"><span id="who"></span> · <a href="#" id="logout" style="color:#8ab4ff">Déconnexion</a></p>
      <form id="add">
        <input id="title" placeholder="Nouvel élément" required maxlength="200">
        <button type="submit">Ajouter</button>
      </form>
      <ul id="list"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // Clé publique (anon) : conçue pour être exposée côté navigateur.
    const sb = supabase.createClient(
      "https://smjbgjolteovcwkoxcar.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtamJnam9sdGVvdmN3a294Y2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzM5MzAsImV4cCI6MjEwODcwOTkzMH0.4n1rikyRKt-rVm5FjR4RtTkV8-ip3EbcsNNPy6xCtts"
    );
    const $ = id => document.getElementById(id);
    const say = t => $("msg").textContent = t || "";

    async function refresh() {
      const { data: { session } } = await sb.auth.getSession();
      $("auth").classList.toggle("hidden", !!session);
      $("app").classList.toggle("hidden", !session);
      if (!session) return;
      $("who").textContent = session.user.email;
      const { data, error } = await sb.from("items").select("*").order("id", { ascending: false });
      if (error) return say("Erreur : " + error.message + " (le script supabase/schema.sql a-t-il été exécuté ?)");
      $("list").innerHTML = "";
      for (const it of data) {
        const li = document.createElement("li");
        const span = document.createElement("span"); span.textContent = it.title;
        const del = document.createElement("button"); del.className = "ghost"; del.textContent = "✕";
        del.onclick = async () => { await sb.from("items").delete().eq("id", it.id); refresh(); };
        li.append(span, del); $("list").append(li);
      }
    }

    $("auth").onsubmit = async e => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
      say(error ? error.message : ""); refresh();
    };
    $("signup").onclick = async () => {
      const { error } = await sb.auth.signUp({ email: $("email").value, password: $("password").value });
      say(error ? error.message : "Compte créé. Vérifiez vos emails si la confirmation est activée, puis connectez-vous.");
    };
    $("logout").onclick = async e => { e.preventDefault(); await sb.auth.signOut(); refresh(); };
    $("add").onsubmit = async e => {
      e.preventDefault();
      const { error } = await sb.from("items").insert({ title: $("title").value });
      if (error) return say(error.message);
      $("title").value = ""; say(""); refresh();
    };
    sb.auth.onAuthStateChange(refresh);
    refresh();
  </script>
  <script>
    // Écran de chargement : visible au moins 1,8 s, retiré quand la page est prête.
    (function () {
      const start = Date.now();
      const hide = () => setTimeout(() => {
        const el = document.getElementById("splash");
        el.classList.add("done");
        setTimeout(() => el.remove(), 700);
      }, Math.max(0, 1800 - (Date.now() - start)));
      if (document.readyState === "complete") hide(); else window.addEventListener("load", hide);
    })();
  </script>
</body>
</html>
