<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nooxel World</title>
  <link rel="icon" href="assets/logo-n.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
  <style>
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { margin: 0; height: 100dvh; box-sizing: border-box; background: #000; color: #fff; font-family: system-ui, sans-serif; display: grid; place-items: center; padding: 2rem 1rem; text-align: center; }
    main { width: 100%; max-width: 420px; }
    input, button { font: inherit; padding: .6rem .8rem; border-radius: 8px; border: 1px solid #333; background: #16161d; color: #fff; }
    button { cursor: pointer; background: #3b82f6; border-color: #3b82f6; }
    button.ghost { background: transparent; border-color: #333; }
    form { display: flex; gap: .5rem; margin: 1rem 0; flex-wrap: wrap; }
    form input { flex: 1; min-width: 0; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; padding: .6rem 0; border-bottom: 1px solid #222; }
    .muted { color: #8a8a99; font-size: .9rem; }
    .hidden { display: none; }

    main { width: 100%; max-width: 380px; }
    .hidden { display: none !important; }
    .muted { color: #8a8a99; font-size: .95rem; }
    .card { display: grid; gap: .9rem; justify-items: stretch; }
    .card .logo-n { width: 84px; margin: 0 auto; }
    .logo-wrap { position: relative; width: 130px; height: 130px; margin: 0 auto; }
    .logo-wrap::before { content: ""; position: absolute; left: 50%; top: 50%; width: 320px; height: 320px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(25,120,255,.35) 0%, rgba(25,120,255,.12) 35%, rgba(0,0,0,0) 65%); pointer-events: none; }
    .logo-planet { position: relative; display: block; width: 130px; height: 130px; border-radius: 23%; }
    .card h1 { font-size: 1.6rem; margin: .2rem 0 0; }
    .card input { font: inherit; font-size: 16px; padding: .8rem 1rem; border-radius: 12px; border: 1px solid #1c2a4a; background: #07102a; color: #fff; outline: none; }
    .card input:focus { border-color: #1a6bff; box-shadow: 0 0 0 3px rgba(26,107,255,.25); }
    .btn-nooxel { display: flex; align-items: center; justify-content: center; gap: .7rem; font: inherit; font-weight: 600; font-size: 1rem; padding: .8rem 1rem; border-radius: 12px; border: 1px solid #1a6bff; background: linear-gradient(180deg, #0b1d4d, #061232); color: #fff; cursor: pointer; transition: box-shadow .2s, transform .1s; }
    .btn-nooxel:hover { box-shadow: 0 0 22px rgba(26,107,255,.5); }
    .btn-nooxel:active { transform: scale(.98); }
    .btn-nooxel:disabled { opacity: .6; cursor: default; }
    .btn-nooxel img { width: 24px; height: 24px; object-fit: contain; }
    .link { background: none; border: 0; color: #6fa8ff; font: inherit; cursor: pointer; padding: .3rem; }
    #msg { min-height: 1.3em; margin: 0; color: #ff8a8a; }
    #msg.ok { color: #7fe3a8; }

    body { background: radial-gradient(ellipse at 50% 40%, #04123a 0%, #000716 60%, #00030b 100%); }
    #welcome { display: grid; justify-items: center; gap: 3.2rem; }
    .planet-wrap { position: relative; width: min(46vw, 200px); }
    .planet-wrap::before { content: ""; position: absolute; left: 50%; top: 50%; width: 170%; aspect-ratio: 1; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(20,110,255,.38) 0%, rgba(20,110,255,.12) 38%, rgba(0,0,0,0) 66%); animation: pulse 3s ease-in-out infinite; pointer-events: none; }
    .planet { position: relative; display: block; width: 100%; animation: float 4s ease-in-out infinite; }
    .intro-bottom { width: 100%; min-height: 90px; display: grid; justify-items: center; align-content: start; gap: 1rem; }
    .loader { width: 100%; max-width: 280px; transition: opacity .4s ease; }
    .loader.out { opacity: 0; }
    .bar { height: 6px; border-radius: 6px; background: rgba(40,90,200,.25); overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #0a5cff, #19b8ff); box-shadow: 0 0 12px rgba(25,150,255,.8); }
    .loader p { margin: .9rem 0 0; color: #7fa8ff; font-size: .95rem; letter-spacing: .04em; }
    .btn-white { width: auto; max-width: 100%; display: flex; align-items: center; justify-content: space-between; gap: .8rem; font: inherit; font-size: .95rem; font-weight: 600; color: #0b1636; background: #fff; border: 0; border-radius: 14px; padding: .65rem 1rem; cursor: pointer; box-shadow: 0 8px 30px rgba(20,110,255,.25); animation: rise .5s ease both; }
    .btn-white:active { transform: scale(.98); }
    .btn-white img { width: 24px; height: 22px; object-fit: contain; }
    @keyframes float { 50% { transform: translateY(-9px); } }
    @keyframes pulse { 50% { opacity: .65; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .planet, .planet-wrap::before, .btn-white { animation: none; } }

    #welcome { gap: 2.4rem; }
    .hero { display: grid; justify-items: center; gap: 1.6rem; transition: transform .45s ease, opacity .45s ease; }
    .brand { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: .32em; text-transform: uppercase; padding-left: .32em; color: #e6f0ff; text-shadow: 0 0 18px rgba(30,130,255,.7); animation: rise .8s ease .2s both; }
    .planet-wrap { perspective: 800px; }
    .planet { animation: float 4s ease-in-out infinite, sway 7s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { rotate: y -9deg; } 50% { rotate: y 9deg; } }
    #welcome.leaving .hero { transform: translateY(-40px) scale(.55); opacity: 0; }
    #welcome.leaving .intro-bottom { opacity: 0; transition: opacity .25s ease; }
    #login, #home { animation: rise .45s ease both; }
    @media (prefers-reduced-motion: reduce) { .planet, .brand { animation: none; } }

    .req { margin: 0; max-width: 270px; color: #6f8fc9; font-size: .85rem; line-height: 1.4; animation: rise .6s ease .15s both; }
    .continue { display: flex; align-items: center; justify-content: center; gap: .4rem; flex-wrap: wrap; }
    .continue img { width: 22px; height: 18px; object-fit: contain; }
    .continue strong { color: #cfe0ff; font-weight: 600; }

    #layer { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 1rem; background: rgba(0,4,16,.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: fade .25s ease both; }
    .gcard { position: relative; width: min(100%, 400px); max-height: 100%; overflow-y: auto; box-sizing: border-box; display: grid; gap: .9rem; padding: 2rem 1.6rem 1.4rem; border-radius: 28px; background: #fff; color: #1f1f1f; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.55); animation: pop .3s ease both; }
    .gcard .logo-n { width: 56px; margin: 0 auto; }
    .gcard h1 { margin: .2rem 0 0; font-size: 1.55rem; font-weight: 500; color: #1f1f1f; }
    .gcard .continue { margin: 0 0 .6rem; color: #5f6368; font-size: .95rem; }
    .gcard .continue strong { color: #1f1f1f; }
    .gcard input { font: inherit; font-size: 16px; padding: .85rem 1rem; border-radius: 10px; border: 1px solid #c4c7c5; background: #fff; color: #1f1f1f; outline: none; }
    .gcard input::placeholder { color: #80868b; }
    .gcard input:focus { border-color: #1a6bff; box-shadow: 0 0 0 2px rgba(26,107,255,.25); }
    .gcard #msg { margin: 0; min-height: 1.2em; color: #d93025; font-size: .9rem; text-align: left; }
    .gcard #msg.ok { color: #188038; }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: .8rem; margin-top: .6rem; }
    .gcard .link { color: #1a6bff; font-weight: 600; font-size: .92rem; padding: .5rem .2rem; text-align: left; }
    .btn-blue { white-space: nowrap; flex-shrink: 0; font: inherit; font-weight: 600; color: #fff; background: #1a6bff; border: 0; border-radius: 999px; padding: .7rem 1.5rem; cursor: pointer; }
    .btn-blue:hover { background: #0f5ae6; }
    .btn-blue:disabled { opacity: .6; cursor: default; }
    @keyframes fade { from { opacity: 0; } }
    @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } }

    .gcard .continue span { white-space: nowrap; }
    .gcard.swap-up { animation: slideLeft .35s ease both; }
    .gcard.swap { animation: slideRight .35s ease both; }
    .gcard.swap-up h1 { color: #1a6bff; }
    @keyframes slideLeft { from { opacity: .3; transform: translateX(40px); } }
    @keyframes slideRight { from { opacity: .3; transform: translateX(-40px); } }

    #chooser { display: grid; gap: .4rem; text-align: left; }
    #acc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; }
    #acc-list li { display: flex; align-items: center; gap: .3rem; padding: 0; border: 0; }
    .acc { flex: 1; min-width: 0; display: flex; align-items: center; gap: .8rem; padding: .7rem .8rem; border: 1px solid #dadce0; border-radius: 14px; background: #fff; color: #1f1f1f; font: inherit; cursor: pointer; text-align: left; }
    .acc:hover { background: #f6f8ff; border-color: #b9ccff; }
    .acc .em { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .98rem; }
    .acc.other { width: 100%; flex: none; border-style: dashed; color: #1a6bff; font-weight: 600; }
    .av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: .95rem; text-transform: uppercase; }
    .av.plus { background: #e8f0ff; color: #1a6bff; font-size: 1.3rem; }
    .rm { flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: #80868b; cursor: pointer; font-size: .9rem; }
    .rm:hover { background: #f1f3f4; color: #d93025; }
    .fields { display: grid; gap: .9rem; }
    .chip { display: flex; align-items: center; gap: .6rem; justify-self: center; max-width: 100%; padding: .3rem .8rem .3rem .3rem; border: 1px solid #dadce0; border-radius: 999px; background: #fff; color: #1f1f1f; font: inherit; font-size: .92rem; cursor: pointer; }
    .chip:hover { background: #f6f8ff; }
    .chip .av { width: 26px; height: 26px; font-size: .8rem; }
    .chip #chip-email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip .caret { color: #5f6368; font-size: .75rem; }
    .empty { margin: .4rem 0 .8rem; padding: 1.1rem; border-radius: 14px; background: #f6f8fc; color: #5f6368; text-align: center; font-size: .98rem; }
    .btn-blue.wide { width: 100%; margin-top: .5rem; padding: .85rem 1.5rem; }
    .btn-outline { width: 100%; display: flex; align-items: center; justify-content: center; gap: .6rem; font: inherit; font-weight: 600; color: #1a6bff; background: #f3f7ff; border: 1.5px solid #1a6bff; border-radius: 999px; padding: .8rem 1.2rem; cursor: pointer; transition: background .15s, transform .1s; }
    .btn-outline:hover { background: #e6efff; }
    .btn-outline:active { transform: scale(.98); }
    #home { position: fixed; inset: 0; z-index: 5; background: #040b1c; }
    #map { position: absolute; inset: 0; }
    #me { position: absolute; top: calc(env(safe-area-inset-top, 0px) + .8rem); right: .8rem; z-index: 6; width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; color: #fff; font: inherit; font-weight: 700; font-size: 1.05rem; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
    #menu { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 3.6rem); right: .8rem; z-index: 6; min-width: 210px; max-width: calc(100vw - 1.6rem); padding: .9rem; border-radius: 18px; background: #fff; color: #1f1f1f; box-shadow: 0 12px 40px rgba(0,0,0,.4); text-align: left; animation: pop .2s ease both; }
    #menu #who { margin: 0 0 .7rem; font-size: .92rem; color: #5f6368; word-break: break-all; }
    #menu #logout { width: 100%; font: inherit; font-weight: 600; color: #d93025; background: #fdecea; border: 0; border-radius: 12px; padding: .65rem; cursor: pointer; }
    #map-error { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; margin: 0; padding: 1rem 1.2rem; border-radius: 14px; background: #fff; color: #1f1f1f; max-width: 80vw; }
    .maplibregl-ctrl-group { background: #fff; border-radius: 14px !important; box-shadow: 0 4px 16px rgba(0,0,0,.4) !important; overflow: hidden; }
    .maplibregl-ctrl-attrib { background: rgba(4,11,28,.7) !important; color: #8fa6d1 !important; }
    .maplibregl-ctrl-attrib a { color: #8fa6d1 !important; }
    .maplibregl-ctrl-bottom-right { bottom: env(safe-area-inset-bottom, 0px); }
  </style>
</head>
<body>
  <main>
    <section id="welcome" class="hidden">
      <div class="hero">
        <div class="planet-wrap"><img class="planet" src="assets/planet.png" alt="Nooxel World"></div>
        <h1 class="brand">Nooxel World</h1>
      </div>
      <div class="intro-bottom">
        <div class="loader" id="loader">
          <div class="bar"><span id="bar-fill"></span></div>
          <p>Chargement…</p>
        </div>
        <button type="button" class="btn-white hidden" id="go-login">
          <span>Se connecter à Nooxel</span>
          <img src="assets/logo-n.png" alt="">
        </button>
        <p class="req hidden" id="req">Un compte Nooxel est requis pour accéder à Nooxel World</p>
      </div>
    </section>

    <div id="layer" class="hidden">
      <form id="login" class="gcard" role="dialog" aria-modal="true" aria-labelledby="title">
        <img class="logo-n" src="assets/logo-n.png" alt="Nooxel">
        <h1 id="title">Connexion</h1>
        <p class="continue" id="sub"></p>
        <div id="chooser" class="hidden">
          <p id="empty" class="empty hidden">Aucun compte sur cet appareil</p>
          <ul id="acc-list"></ul>
          <button type="button" class="btn-outline" id="other"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg><span id="other-label">Utiliser un autre compte</span></button>
          <button type="button" class="btn-blue wide" id="create">Créer un compte</button>
        </div>
        <div id="fields" class="fields">
          <button type="button" id="chip" class="chip hidden" aria-label="Changer de compte"><span class="av" id="chip-av"></span><span id="chip-email"></span><span class="caret">▾</span></button>
        <input id="email" type="email" placeholder="Email" autocomplete="email" required>
          <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
          <input id="password2" class="hidden" type="password" placeholder="Confirmer le mot de passe" autocomplete="new-password" minlength="6">
          <p id="msg" role="alert"></p>
          <div class="actions">
            <button type="button" class="link" id="toggle">← Retour</button>
            <button type="submit" class="btn-blue" id="submit"><span id="submit-label">Se connecter</span></button>
          </div>
        </div>
      </form>
    </div>

    <section id="home" class="hidden">
      <div id="map" aria-label="Carte"></div>
      <button type="button" id="me" aria-label="Mon compte"></button>
      <div id="menu" class="hidden" role="menu">
        <p id="who"></p>
        <button type="button" id="logout" role="menuitem">Se déconnecter</button>
      </div>
      <p id="map-error" class="hidden">Impossible de charger la carte. Vérifiez votre connexion.</p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // Clé publique (anon) : conçue pour être exposée côté navigateur.
    const sb = supabase.createClient(
      "https://smjbgjolteovcwkoxcar.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtamJnam9sdGVvdmN3a294Y2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzM5MzAsImV4cCI6MjEwODcwOTkzMH0.4n1rikyRKt-rVm5FjR4RtTkV8-ip3EbcsNNPy6xCtts"
    );
    const $ = id => document.getElementById(id);
    let signupMode = false;

    function frError(m) {
      const t = (m || "").toLowerCase();
      if (t.includes("not confirmed")) return "Email non confirmé : ouvrez le message de confirmation reçu par email.";
      if (t.includes("invalid login")) return "Email ou mot de passe incorrect.";
      if (t.includes("already registered")) return "Un compte existe déjà avec cet email.";
      if (t.includes("rate limit") || t.includes("too many")) return "Trop de tentatives, réessayez dans quelques minutes.";
      if (t.includes("password")) return "Mot de passe trop court ou invalide (6 caractères minimum).";
      return m;
    }
    function say(text, ok) { $("msg").textContent = text || ""; $("msg").classList.toggle("ok", !!ok); }

    const SUB = '<span>pour continuer vers</span> <img src="assets/planet.png" alt=""> <strong>Nooxel World</strong>';
    const SUB_UP = '<span>Un seul compte pour accéder à</span> <img src="assets/planet.png" alt=""> <strong>Nooxel World</strong>';

    function setMode(signup, animate) {
      signupMode = signup;
      $("title").textContent = signup ? "Créer un compte Nooxel" : "Connexion";
      $("sub").innerHTML = signup ? SUB_UP : SUB;
      $("submit-label").textContent = signup ? "Créer mon compte" : "Se connecter";
      $("toggle").textContent = "← Retour";
      $("password").autocomplete = signup ? "new-password" : "current-password";
      $("password").placeholder = signup ? "Mot de passe (6 caractères min.)" : "Mot de passe";
      $("password").minLength = signup ? 6 : 0;
      $("password2").classList.toggle("hidden", !signup);
      $("password2").required = signup;
      $("password2").value = "";
      say("");
      if (animate) {
        const f = $("login");
        f.classList.remove("swap"); void f.offsetWidth;
        
        f.classList.toggle("swap-up", signup); f.classList.toggle("swap", !signup);
      }
    }
    setMode(false);


    // ----- Comptes mémorisés sur cet appareil (emails seulement, jamais de mot de passe)
    const KEY = "nooxel_accounts";
    const loadAccounts = () => { try { const a = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
    const storeAccounts = a => { try { localStorage.setItem(KEY, JSON.stringify(a.slice(0, 5))); } catch (e) {} };
    const saveAccount = email => storeAccounts([email, ...loadAccounts().filter(x => x !== email)]);
    const removeAccount = email => storeAccounts(loadAccounts().filter(x => x !== email));
    const hue = str => [...str].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
    function paintAvatar(el, email) { el.textContent = email[0]; el.style.background = `hsl(${hue(email)} 65% 45%)`; }

    function showChooser() {
      const list = loadAccounts();
      $("title").textContent = "Choisir un compte";
      $("empty").classList.toggle("hidden", list.length > 0);
      $("other-label").textContent = list.length ? "Utiliser un autre compte" : "J'ai déjà un compte";
      $("sub").innerHTML = SUB;
      $("acc-list").innerHTML = "";
      for (const email of list) {
        const li = document.createElement("li");
        const b = document.createElement("button"); b.type = "button"; b.className = "acc";
        const av = document.createElement("span"); av.className = "av"; paintAvatar(av, email);
        const em = document.createElement("span"); em.className = "em"; em.textContent = email;
        b.append(av, em); b.onclick = () => showForm(email);
        const rm = document.createElement("button"); rm.type = "button"; rm.className = "rm"; rm.textContent = "✕"; rm.title = "Retirer de cet appareil"; rm.setAttribute("aria-label", "Retirer " + email);
        rm.onclick = () => { removeAccount(email); showChooser(); };
        li.append(b, rm); $("acc-list").append(li);
      }
      $("chooser").classList.remove("hidden"); $("fields").classList.add("hidden"); say("");
    }

    function showForm(email) {
      $("chooser").classList.add("hidden"); $("fields").classList.remove("hidden");
      setMode(signupMode);
      const known = !!email && !signupMode;
      $("email").classList.toggle("hidden", known);
      $("chip").classList.toggle("hidden", !known);
      if (known) { $("email").value = email; $("chip-email").textContent = email; paintAvatar($("chip-av"), email); }
      else if (email === undefined) $("email").value = $("email").value;
    }
    $("chip").onclick = () => showChooser();
    $("other").onclick = () => { $("email").value = ""; showForm(); };
    $("create").onclick = () => {
      setMode(true, true);
      $("chooser").classList.add("hidden"); $("fields").classList.remove("hidden");
      $("email").classList.remove("hidden"); $("chip").classList.add("hidden"); $("email").value = "";
    };

    let wantsLogin = false;

    async function render() {
      const { data: { session } } = await sb.auth.getSession();
      $("welcome").classList.toggle("hidden", !!session);
      $("layer").classList.toggle("hidden", !!session || !wantsLogin);
      $("home").classList.toggle("hidden", !session);
      if (session) {
        wantsLogin = false;
        const email = session.user.email || "?";
        $("who").textContent = email;
        $("me").textContent = email[0];
        $("me").style.background = `hsl(${hue(email)} 65% 45%)`;
        startMap();
      } else { $("menu").classList.add("hidden"); }
    }

    // ----- Carte (MapLibre + OpenStreetMap via OpenFreeMap, sans clé API)
    let map = null;
    function startMap() {
      if (map) { map.resize(); return; }
      try {
        map = new maplibregl.Map({
          container: "map",
          style: new URL("assets/map-style.json", location.href).href,
          center: [2.35, 46.8],
          zoom: 4.6,
          attributionControl: { compact: true }
        });
        map.addControl(new maplibregl.NavigationControl({ showCompass: true }), "bottom-right");
        map.addControl(new maplibregl.GeolocateControl({
          positionOptions: { enableHighAccuracy: true },
          trackUserLocation: true,
          showUserHeading: true
        }), "bottom-right");
        map.on("error", e => { if (e && e.error && !map.loaded()) $("map-error").classList.remove("hidden"); });
        map.on("load", () => $("map-error").classList.add("hidden"));
      } catch (e) {
        $("map-error").classList.remove("hidden");
      }
    }
    $("me").onclick = () => $("menu").classList.toggle("hidden");
    $("map").addEventListener("pointerdown", () => $("menu").classList.add("hidden"));

    // Écran de chargement : la barre se remplit, puis le bouton blanc apparaît.
    const LOAD_MS = 2600;
    const t0 = Date.now();
    $("bar-fill").animate([{ width: "0%" }, { width: "100%" }], { duration: LOAD_MS, easing: "ease-in-out", fill: "forwards" });
    function showButton() {
      $("loader").classList.add("out");
      setTimeout(() => { $("loader").classList.add("hidden"); $("go-login").classList.remove("hidden"); $("req").classList.remove("hidden"); if (navigator.vibrate) navigator.vibrate(15); }, 400);
    }
    const ready = () => setTimeout(showButton, Math.max(0, LOAD_MS - (Date.now() - t0)));
    if (document.readyState === "complete") ready(); else window.addEventListener("load", ready);

    // Curseur dans le champ email seulement avec une souris : sur téléphone, ça ouvrirait le clavier tout de suite.
    $("go-login").onclick = () => {
      wantsLogin = true; render(); showChooser();
    };
    const closeCard = () => { wantsLogin = false; setMode(false); $("email").value = ""; $("password").value = ""; render(); };
    $("layer").addEventListener("click", e => { if (e.target === $("layer")) closeCard(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && wantsLogin) closeCard(); });

    $("toggle").onclick = () => { setMode(false, true); showChooser(); };
    $("login").onsubmit = async e => {
      e.preventDefault();
      if (signupMode && $("password").value !== $("password2").value) return say("Les mots de passe ne correspondent pas.");
      $("submit").disabled = true; say("");
      const creds = { email: $("email").value.trim(), password: $("password").value };
      const { data, error } = signupMode ? await sb.auth.signUp(creds) : await sb.auth.signInWithPassword(creds);
      $("submit").disabled = false;
      if (error) return say(frError(error.message));
      if (signupMode && !data.session) {
        // Confirmation par email activée côté Supabase : on reste sur l'inscription et on explique.
        saveAccount(creds.email);
        return say("Compte créé. Un email de confirmation a été envoyé à " + creds.email + ". Ouvrez-le pour activer votre compte.", true);
      }
      saveAccount(creds.email); render();
    };
    $("logout").onclick = async () => { await sb.auth.signOut(); render(); };
    sb.auth.onAuthStateChange(() => render());
    render();
  </script>
</body>
</html>
