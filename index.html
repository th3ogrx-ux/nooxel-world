<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nooxel World</title>
  <link rel="icon" href="assets/logo-n.png">
  <style>
    body { margin: 0; min-height: 100vh; background: #000; color: #fff; font-family: system-ui, sans-serif; display: grid; place-items: center; padding: 2rem 1rem; text-align: center; }
    main { width: 100%; max-width: 420px; }
    input, button { font: inherit; padding: .6rem .8rem; border-radius: 8px; border: 1px solid #333; background: #16161d; color: #fff; }
    button { cursor: pointer; background: #3b82f6; border-color: #3b82f6; }
    button.ghost { background: transparent; border-color: #333; }
    form { display: flex; gap: .5rem; margin: 1rem 0; flex-wrap: wrap; }
    form input { flex: 1; min-width: 0; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; padding: .6rem 0; border-bottom: 1px solid #222; }
    .muted { color: #8a8a99; font-size: .9rem; }
    .hidden { display: none; }

    #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #04122e 0%, #000 70%); transition: opacity .6s ease, visibility .6s ease; }
    #splash.done { opacity: 0; visibility: hidden; }
    .splash-inner { display: grid; justify-items: center; gap: 1.6rem; }
    .splash-logo { width: min(50vw, 220px); border-radius: 23%; animation: float 3s ease-in-out infinite, glow 2.4s ease-in-out infinite; }
    .splash-name { font-size: 1.4rem; letter-spacing: .5em; text-transform: uppercase; color: #cfe3ff; margin: 0; padding-left: .5em; }
    .splash-bar { width: 180px; height: 3px; border-radius: 3px; background: #0a1c3f; overflow: hidden; }
    .splash-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #0a5cff, #19d3ff); animation: load 1.2s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-10px); } }
    @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 18px rgba(25,120,255,.45)); } 50% { filter: drop-shadow(0 0 40px rgba(25,211,255,.8)); } }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    @media (prefers-reduced-motion: reduce) { .splash-logo, .splash-bar::after { animation: none; } }

    main { width: 100%; max-width: 380px; }
    .hidden { display: none !important; }
    .muted { color: #8a8a99; font-size: .95rem; }
    .card { display: grid; gap: .9rem; justify-items: stretch; }
    .card .logo-n { width: 84px; margin: 0 auto; }
    .card h1 { font-size: 1.6rem; margin: .2rem 0 0; }
    .card input { font: inherit; font-size: 16px; padding: .8rem 1rem; border-radius: 12px; border: 1px solid #1c2a4a; background: #07102a; color: #fff; outline: none; }
    .card input:focus { border-color: #1a6bff; box-shadow: 0 0 0 3px rgba(26,107,255,.25); }
    .btn-nooxel { display: flex; align-items: center; justify-content: center; gap: .7rem; font: inherit; font-weight: 600; font-size: 1rem; padding: .8rem 1rem; border-radius: 12px; border: 1px solid #1a6bff; background: linear-gradient(180deg, #0b1d4d, #061232); color: #fff; cursor: pointer; transition: box-shadow .2s, transform .1s; }
    .btn-nooxel:hover { box-shadow: 0 0 22px rgba(26,107,255,.5); }
    .btn-nooxel:active { transform: scale(.98); }
    .btn-nooxel:disabled { opacity: .6; cursor: default; }
    .btn-nooxel img { width: 24px; height: 24px; object-fit: contain; }
    .link { background: none; border: 0; color: #6fa8ff; font: inherit; cursor: pointer; padding: .3rem; }
    #msg { min-height: 1.3em; margin: 0; color: #ff8a8a; }
    #msg.ok { color: #7fe3a8; }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Chargement">
    <div class="splash-inner">
      <img class="splash-logo" src="assets/logo.png" alt="Nooxel World">
      <p class="splash-name">Nooxel</p>
      <div class="splash-bar"></div>
    </div>
  </div>
  <main>
    <form id="login" class="card hidden">
      <img class="logo-n" src="assets/logo-n.png" alt="Nooxel">
      <h1>Bienvenue sur Nooxel</h1>
      <p class="muted" id="sub">Connectez-vous pour continuer.</p>
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="current-password" minlength="6" required>
      <button type="submit" class="btn-nooxel" id="submit"><img src="assets/logo-n.png" alt=""><span id="submit-label">Se connecter avec Nooxel</span></button>
      <p id="msg" role="alert"></p>
      <button type="button" class="link" id="toggle">Pas de compte ? Créer un compte</button>
    </form>

    <section id="home" class="card hidden">
      <img class="logo-n" src="assets/logo-n.png" alt="Nooxel">
      <h1>Nooxel World</h1>
      <p class="muted">La carte arrive bientôt.</p>
      <p class="muted" id="who"></p>
      <button type="button" class="link" id="logout">Se déconnecter</button>
    </section>
  </main>

  <script>
    // Écran de chargement : visible au moins 1,8 s, retiré quand la page est prête.
    (function () {
      const start = Date.now();
      const hide = () => setTimeout(() => {
        const el = document.getElementById("splash");
        el.classList.add("done");
        setTimeout(() => el.remove(), 700);
      }, Math.max(0, 1800 - (Date.now() - start)));
      if (document.readyState === "complete") hide(); else window.addEventListener("load", hide);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // Clé publique (anon) : conçue pour être exposée côté navigateur.
    const sb = supabase.createClient(
      "https://smjbgjolteovcwkoxcar.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtamJnam9sdGVvdmN3a294Y2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzM5MzAsImV4cCI6MjEwODcwOTkzMH0.4n1rikyRKt-rVm5FjR4RtTkV8-ip3EbcsNNPy6xCtts"
    );
    const $ = id => document.getElementById(id);
    let signupMode = false;

    function say(text, ok) { $("msg").textContent = text || ""; $("msg").classList.toggle("ok", !!ok); }

    function setMode(signup) {
      signupMode = signup;
      $("submit-label").textContent = signup ? "Créer mon compte Nooxel" : "Se connecter avec Nooxel";
      $("toggle").textContent = signup ? "Déjà un compte ? Se connecter" : "Pas de compte ? Créer un compte";
      $("password").autocomplete = signup ? "new-password" : "current-password";
      say("");
    }

    async function render() {
      const { data: { session } } = await sb.auth.getSession();
      $("login").classList.toggle("hidden", !!session);
      $("home").classList.toggle("hidden", !session);
      if (session) $("who").textContent = session.user.email;
    }

    $("toggle").onclick = () => setMode(!signupMode);
    $("login").onsubmit = async e => {
      e.preventDefault();
      $("submit").disabled = true; say("");
      const creds = { email: $("email").value.trim(), password: $("password").value };
      const { data, error } = signupMode ? await sb.auth.signUp(creds) : await sb.auth.signInWithPassword(creds);
      $("submit").disabled = false;
      if (error) return say(error.message);
      if (signupMode && !data.session) { say("Compte créé. Confirmez votre email, puis connectez-vous.", true); return setMode(false); }
      render();
    };
    $("logout").onclick = async () => { await sb.auth.signOut(); render(); };
    sb.auth.onAuthStateChange(() => render());
    render();
  </script>
</body>
</html>
